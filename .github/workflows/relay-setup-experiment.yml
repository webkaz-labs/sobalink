name: Experimental relay setup operations
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - experiments/relay-setup/**
      - .github/workflows/relay-setup-experiment.yml
permissions:
  contents: read
concurrency:
  group: relay-setup-experiment-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  relay-operations:
    if: github.repository == 'webkaz-labs/sobalink' && github.event.repository.private == false && github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-26, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Compile isolated relay tests
        run: |
          set -euo pipefail
          python experiments/relay-setup/verify_sources.py
          (cd experiments/relay-setup && python -m unittest -v test_tools.py)
          cp experiments/relay-setup/relay_operations_test.go.txt internal/lanlink/relay_operations_experiment_test.go
          test -z "$(gofmt -l internal/lanlink/relay_operations_experiment_test.go)"
          tags=relay_setup_experiment,lanlink_integration,ts_omit_udptransport,ts_omit_portmapper,ts_omit_captiveportal,ts_omit_useproxy
          go vet -tags="$tags" ./internal/lanlink
          go test -race -tags="$tags" -c -o "$RUNNER_TEMP/relay-operations.test.exe" ./internal/lanlink
      - name: Verify native relay lifecycle and real lease
        run: |
          python experiments/relay-setup/run_operations.py --binary "$RUNNER_TEMP/relay-operations.test.exe" --report "$RUNNER_TEMP/relay-operations-report/summary.json"
      - name: Verify existing setup model
        run: |
          go test -race -tags=ts_omit_portmapper,ts_omit_captiveportal,ts_omit_useproxy -run='^(TestLAN(AddressChoices|Inspection|HostReadiness|FailedHostStart|SetupSelects|ConfigureCommands)|TestExpiredHostCertificateCanLoadForExplicitRecovery)' ./internal/core
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: relay-operations-${{ matrix.runner }}
          path: ${{ runner.temp }}/relay-operations-report/summary.json
          if-no-files-found: error
          retention-days: 14
