name: Published binary resource observation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/release-resources.yml
      - .github/scripts/resource_observer.py
      - .github/scripts/test_resource_observer.py
      - .github/scripts/measure-release-resources.py
      - .github/scripts/test_measure_release_resources.py
      - docs/RESOURCE_MEASUREMENT.en.md
      - docs/RESOURCE_MEASUREMENT.ja.md

permissions:
  contents: read

concurrency:
  group: published-resource-observation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  released-linux-amd64-offline:
    if: github.repository == 'webkaz-labs/sobalink' && github.event.repository.private == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RELEASE_VERSION: 0.3.0-alpha.2
      TESTED_COMMIT: 00cc6a99809df77bf1754936ea7bf5ca4c5d0741
      RELEASE_ID: '402850401'
      RELEASE_IDENTITY: https://github.com/webkaz-labs/sobalink/.github/workflows/prerelease.yml@refs/heads/main
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Isolate package installation in runner temporary storage
        run: echo "MISE_DATA_DIR=$RUNNER_TEMP/sobalink-resource-mise" >> "$GITHUB_ENV"
      - name: Verify measurement logic without sockets
        run: |
          set -euo pipefail
          python -m unittest discover -s .github/scripts -p 'test_resource_observer.py' -v
          python -m unittest discover -s .github/scripts -p 'test_measure_release_resources.py' -v
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: '2026.9.18'
          install: false
          cache: false
      - name: Verify the immutable published source, signatures, and provenance
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY' > /dev/null 2>&1
          import importlib.util
          import os
          import pathlib
          spec = importlib.util.spec_from_file_location('release_validation', '.github/scripts/release-validation.py')
          release = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(release)
          version, commit = os.environ['RELEASE_VERSION'], os.environ['TESTED_COMMIT']
          _, published = release.release_state(version, commit, required=True, published=True)
          release.require(published['id'] == int(os.environ['RELEASE_ID']), 'published release identity changed')
          release.download_public(pathlib.Path(os.environ['RUNNER_TEMP']) / 'sobalink-resource-public', version, commit)
          PY
          mise install github:jdx/packslip@1.4.0 > /dev/null 2>&1
          public_dir="$RUNNER_TEMP/sobalink-resource-public"
          args=()
          for file in "$public_dir"/*.tar.gz "$public_dir"/*.zip "$public_dir"/*.cdx.json; do args+=(--artifact "$file"); done
          mise exec github:jdx/packslip@1.4.0 -- packslip verify "$public_dir/packslip.sigstore.json" \
            --identity "$RELEASE_IDENTITY" --issuer https://token.actions.githubusercontent.com "${args[@]}" > /dev/null 2>&1
          python .github/scripts/release-validation.py bundle --root "$public_dir" > /dev/null 2>&1
          for file in "$public_dir"/*; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --cert-identity "$RELEASE_IDENTITY" --cert-oidc-issuer https://token.actions.githubusercontent.com \
              --source-digest "$TESTED_COMMIT" --source-ref refs/heads/main --deny-self-hosted-runners > /dev/null 2>&1
          done
          echo 'Exact public release identity, checksums, Packslip signature, and provenance verified.'
      - name: Install the exact published package through Packslip
        timeout-minutes: 5
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tool='packslip:github.com/webkaz-labs/sobalink[prerelease=true]@0.3.0-alpha.2'
          mise install "$tool" > /dev/null 2>&1
          echo 'Exact published Packslip package installed with normal verification.'
      - name: Observe idle resources and bounded lifecycle recovery
        timeout-minutes: 24
        run: |
          set -euo pipefail
          tool='packslip:github.com/webkaz-labs/sobalink[prerelease=true]@0.3.0-alpha.2'
          install_dir="$(mise where "$tool")"
          python .github/scripts/measure-release-resources.py \
            --install "$install_dir" \
            --public-build "$RUNNER_TEMP/sobalink-resource-public/sobalink-0.3.0-alpha.2-linux-amd64.build.json" \
            --control "$RUNNER_TEMP/sobalink-resource-control.json" \
            --report "$RUNNER_TEMP/sobalink-resource-reports/offline-linux-amd64.json"
      - name: Finish owned fixture cleanup after interruption
        if: always()
        timeout-minutes: 1
        run: |
          python .github/scripts/measure-release-resources.py --cleanup-only \
            --control "$RUNNER_TEMP/sobalink-resource-control.json" \
            --report "$RUNNER_TEMP/sobalink-resource-reports/offline-linux-amd64.json"
      - name: Preserve only aggregate resource counters
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: released-0.3.0-alpha.2-offline-linux-amd64-resources
          path: ${{ runner.temp }}/sobalink-resource-reports/offline-linux-amd64.json
          if-no-files-found: warn
          retention-days: 14
