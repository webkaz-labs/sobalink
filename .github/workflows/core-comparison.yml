name: Paired Core profile (not acceptance)

# One-off comparison branch only. Never add this workload to ordinary CI.
# macOS completed in run 42392297128; repeat only the corrected Windows probe.
on:
  push:
    branches: [perf/profile-core-unit-comparison]

permissions:
  contents: read

concurrency:
  group: core-profile-${{ github.run_id }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  GOWORK: 'off'
  GOFLAGS: -mod=readonly -tags=ts_omit_portmapper,ts_omit_captiveportal,ts_omit_useproxy
  CGO_ENABLED: '1'

jobs:
  profile:
    if: github.repository == 'webkaz-labs/sobalink' && github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: windows-amd64
    defaults:
      run:
        shell: bash
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Compare whole Core on this runner
        env:
          SOBALINK_CORE_NATIVE_PLATFORM: ${{ matrix.platform }}
        run: python -B .github/scripts/profile-core-comparison.py
      - name: Preserve only sanitized experimental observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: core-profile-${{ matrix.platform }}
          path: ${{ runner.temp }}/core-profile-results/profile.json
          if-no-files-found: error
          retention-days: 14
