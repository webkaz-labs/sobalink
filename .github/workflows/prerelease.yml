name: Experimental prerelease

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Prerelease version without v (for example 0.3.0-alpha.1)'
        required: true
        type: string
      tested_commit:
        description: 'Exact current main SHA with successful forced full CI (40 lowercase hex characters)'
        required: true
        type: string

permissions:
  contents: read

# Serialize publication, including retries; never cancel an in-flight release.
concurrency:
  group: experimental-prerelease
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  GOWORK: 'off'
  GOFLAGS: -mod=readonly -tags=ts_omit_portmapper,ts_omit_captiveportal,ts_omit_useproxy

jobs:
  gate:
    if: github.event.repository.private == false && github.repository == 'webkaz-labs/sobalink'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.gate.outputs.version }}
      tag: ${{ steps.gate.outputs.tag }}
      commit: ${{ steps.gate.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Test fail-closed release guards
        run: python -m unittest discover -s .github/scripts -p 'test_release_validation.py' -v
      - name: Require exact main source, successful CI, and unpublished prerelease
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          TESTED_COMMIT: ${{ inputs.tested_commit }}
        run: python .github/scripts/release-validation.py gate --proof "$RUNNER_TEMP/ci-full-proof.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-validation-tools
          path: |
            .github/scripts/release-validation.py
            .github/scripts/ci_full_validation.py
            .github/scripts/verify-installed.py
            .github/scripts/offline-smoke.py
            .github/scripts/source_provenance.py
          if-no-files-found: error
          retention-days: 14

      - name: Preserve exact-source full-CI proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-full-validation-proof
          path: ${{ runner.temp }}/ci-full-proof.json
          if-no-files-found: error
          retention-days: 90

  native:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-26
            goos: darwin
            goarch: arm64
          - runner: windows-2025
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.runner }}
    # Preserve per-gate bounds while allowing the complete native/package chain.
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ needs.gate.outputs.version }}
      TESTED_COMMIT: ${{ needs.gate.outputs.commit }}
      TARGET_OS: ${{ matrix.goos }}
      TARGET_ARCH: ${{ matrix.goarch }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.gate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          check-latest: false
          package-manager-cache: false
      - name: Test and reproduce locked frontend assets
        run: |
          npm install --global npm@11.9.0 --no-audit --no-fund
          python .github/scripts/check-frontend.py
      - name: Locate Go module and compilation caches
        id: go-cache-info
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = go1.27.1
          echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      # Only main CI writes this namespace. Release restores the exact tested SHA;
      # GitHub's branch scope and the release gate exclude PR and branch caches.
      - name: Restore trusted main Go caches
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ steps.go-cache-info.outputs.gomodcache }}
            ${{ steps.go-cache-info.outputs.gocache }}
          key: trusted-main-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.runner }}-go1.27.1-${{ hashFiles('go.mod', 'go.sum', 'internal/engineadaptation/**', 'internal/lifecycleadaptation/**', 'cmd/prepare-engine/**') }}-${{ needs.gate.outputs.commit }}
      - name: Report Go cache result and require an exact release key
        env:
          CACHE_PRIMARY_KEY: ${{ steps.go-cache.outputs.cache-primary-key }}
          CACHE_MATCHED_KEY: ${{ steps.go-cache.outputs.cache-matched-key }}
          CACHE_HIT: ${{ steps.go-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          mkdir -p logs
          printf 'Go cache exact hit: %s\nRequested key: %s\nMatched key: %s\n' "${CACHE_HIT:-miss}" "$CACHE_PRIMARY_KEY" "${CACHE_MATCHED_KEY:-none}" | tee logs/go-cache.txt
          test -z "$CACHE_MATCHED_KEY" || test "$CACHE_MATCHED_KEY" = "$CACHE_PRIMARY_KEY"
      - name: Verify source, exact toolchain, native target, and dependencies
        run: |
          set -euo pipefail
          mkdir -p logs
          test "$(git rev-parse HEAD)" = "$TESTED_COMMIT"
          test "$(go env GOVERSION)" = go1.27.1
          test "$(go env GOOS)" = "$TARGET_OS"
          test "$(go env GOARCH)" = "$TARGET_ARCH"
          go run ./cmd/prepare-engine
          go run ./cmd/prepare-engine --verify
          go mod verify 2>&1 | tee logs/dependencies.txt
      - name: Native race tests (local and mocked services only)
        run: |
          set -euo pipefail
          go test -race -count=1 -timeout=10m ./... 2>&1 | tee logs/race-tests.txt
          # Enforce offline route-revocation recovery using the real protected fixture.
          go test -race -count=1 -tags=soba_e2e,ts_omit_portmapper,ts_omit_captiveportal,ts_omit_useproxy -run='^TestRoute(BrowserFixture|OfflineFailed)' -timeout=2m ./internal/core 2>&1 | tee -a logs/race-tests.txt
          go test -race -count=1 -timeout=3m ./internal/backendworker ./internal/connectionroute
          go test -race -count=1 -timeout=3m ./internal/core -run '^TestMixed'
          # Exercise actual named-pipe/Unix cleanup repeatedly before publication.
          go test -race -count=25 -timeout=3m ./internal/control 2>&1 | tee logs/ipc-regression.txt
      - name: Verify adapted engine admission and native underlay denial
        timeout-minutes: 20
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import os
          import subprocess

          # Upstream test-only dependencies stay in the original immutable
          # upstream module graph; product tests use the product graph above.
          env = {k: v for k, v in os.environ.items()
                 if k.upper() not in ("HTTP_PROXY", "HTTPS_PROXY", "ALL_PROXY", "TS_PROXY")
                 and not k.upper().startswith("TS_")}
          env["SOBALINK_RUN_UNDERLAY_NATIVE"] = "1"
          base = ["go", "test", "-mod=readonly", "-race", "-count=1", "-v", "-timeout=5m",
                  "-tags=ts_omit_portmapper,ts_omit_captiveportal,ts_omit_useproxy"]
          subprocess.run(base + ["./net/underlayguard"],
                         cwd=".sobalink-deps/tailscale", env=env, check=True, timeout=5 * 60)
          subprocess.run(base + ["-run=^Test(UnderlayGuard|WANCandidate|Sobalink|GuardedLocalSocketEndpointUsesActualFamilyPort)", "./wgengine", "./wgengine/magicsock", "./derp", "./derp/derphttp", "./net/netcheck"],
                         cwd=".sobalink-deps/tailscale", env=env, check=True, timeout=5 * 60)
          PYTHON
          python .github/scripts/underlay-negative-controls.py --source .sobalink-deps/tailscale
          go run ./cmd/prepare-engine --verify
      - name: Verify Core context control over pinned TLS
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python .github/scripts/ci-context-control.py core-tls 2>&1 | tee logs/context-core-tls.txt
      - name: Verify context control over fixed loopback TCP
        timeout-minutes: 2
        run: |
          set -euo pipefail
          python .github/scripts/ci-context-control.py fixed-tcp 2>&1 | tee logs/context-fixed-tcp.txt
      - name: Verify managed session tls
        timeout-minutes: 4
        run: |
          set -euo pipefail
          python .github/scripts/ci-managed-session.py tls 2>&1 | tee logs/managed-session-tls.txt
      - name: Verify managed session outbound-tcp
        timeout-minutes: 4
        run: |
          set -euo pipefail
          python .github/scripts/ci-managed-session.py outbound-tcp 2>&1 | tee logs/managed-session-outbound-tcp.txt
      - name: Verify managed session native-caller
        timeout-minutes: 4
        run: |
          set -euo pipefail
          python .github/scripts/ci-managed-session.py native-caller 2>&1 | tee logs/managed-session-native-caller.txt
      - name: Verify managed session native-simultaneous
        timeout-minutes: 4
        run: |
          set -euo pipefail
          python .github/scripts/ci-managed-session.py native-simultaneous 2>&1 | tee logs/managed-session-native-simultaneous.txt
      - name: Verify managed session native-udp-capacity
        timeout-minutes: 4
        run: |
          set -euo pipefail
          python .github/scripts/ci-managed-session.py native-udp-capacity 2>&1 | tee logs/managed-session-native-udp-capacity.txt
      - name: Verify managed activation acceptance
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python .github/scripts/ci-managed-activation.py activation 2>&1 | tee logs/managed-activation.txt
      - name: Verify managed restart acceptance
        timeout-minutes: 4
        run: |
          set -euo pipefail
          python .github/scripts/ci-managed-activation.py restart 2>&1 | tee logs/managed-restart.txt
      - name: Verify direct LAN WireGuard and Core native applications
        timeout-minutes: 9
        run: |
          set -euo pipefail
          go test -race -count=2 -v -timeout=3m -tags=directlan_integration,ts_omit_portmapper,ts_omit_captiveportal,ts_omit_useproxy ./internal/directlan
          go vet -tags=directlan_integration,ts_omit_portmapper,ts_omit_captiveportal,ts_omit_useproxy ./internal/directlan
          go test -race -count=5 -timeout=5m -tags=directlan_integration,ts_omit_portmapper,ts_omit_captiveportal,ts_omit_useproxy -run='^TestDirectLAN' ./internal/core
      - name: Verify direct LAN session rekey and idle lifecycle
        timeout-minutes: 9
        run: |
          set -euo pipefail
          python .github/scripts/ci-go-test.py --expect github.com/webkaz-labs/sobalink/internal/directlan:TestNativeSessionSyntheticExpiryRekey --expect github.com/webkaz-labs/sobalink/internal/directlan:TestNativeSessionLifecycle --expect github.com/webkaz-labs/sobalink/internal/directlan:TestNativeSessionLifecycle/active-through-natural-rekey --expect github.com/webkaz-labs/sobalink/internal/directlan:TestNativeSessionLifecycle/idle-through-natural-expiry-new-dial -- go test -race -count=1 -timeout=8m -tags=directlan_integration,directlan_lifecycle,ts_omit_portmapper,ts_omit_captiveportal,ts_omit_useproxy -run='^TestNativeSession(SyntheticExpiryRekey|Lifecycle)$' ./internal/directlan
      - name: Verify explicit WAN discovery with isolated native STUN
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import os
          import subprocess
          import sys

          # Synthetic native loopback fixture only; this does not establish
          # real NAT traversal, physical IPv6 routes, or device acceptance.
          env = {k: v for k, v in os.environ.items()
                 if k.upper() not in ("HTTP_PROXY", "HTTPS_PROXY", "ALL_PROXY", "TS_PROXY")
                 and not k.upper().startswith("TS_")}
          env["SOBALINK_RUN_WAN_INTEGRATION"] = "1"
          subprocess.run([
              sys.executable, ".github/scripts/ci-go-test.py",
              "--expect", "github.com/webkaz-labs/sobalink/internal/routecat:TestWANCandidateNativeLoopbackSTUN",
              "--",
              "go", "test", "-race", "-count=1", "-v", "-timeout=120s",
              "-tags=lanlink_integration,ts_omit_portmapper,ts_omit_captiveportal,ts_omit_useproxy",
              "-run=^TestWANCandidateNativeLoopbackSTUN$", "./internal/routecat",
          ], env=env, check=True, timeout=4 * 60)
          PYTHON
      - name: Verify guarded production direct and relay underlays
        timeout-minutes: 9
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import os
          import subprocess
          import sys

          # Normal production build with explicit synthetic loopback grants.
          # Clear overrides only for the child test process, never the runner.
          env = {k: v for k, v in os.environ.items()
                 if k.upper() not in ("HTTP_PROXY", "HTTPS_PROXY", "ALL_PROXY", "TS_PROXY")
                 and not k.upper().startswith("TS_")}
          env["SOBALINK_RUN_GUARDED_INTEGRATION"] = "1"
          subprocess.run([
              sys.executable, ".github/scripts/ci-go-test.py",
              "--expect", "github.com/webkaz-labs/sobalink/internal/lanlink:TestGuardedRelayTwoPeerIntegration",
              "--expect", "github.com/webkaz-labs/sobalink/internal/routecat:TestGuardedDirectEncryptedTCPUDPIntegration",
              "--expect", "github.com/webkaz-labs/sobalink/internal/routecat:TestGuardedDERPFailurePropagationIntegration",
              "--",
              "go", "test", "-race", "-count=1", "-v",
              "-tags=lanlink_integration,ts_omit_portmapper,ts_omit_captiveportal,ts_omit_useproxy",
              "-run=^(TestGuardedRelayTwoPeerIntegration|TestGuardedDirectEncryptedTCPUDPIntegration|TestGuardedDERPFailurePropagationIntegration)$",
              "-timeout=5m", "./internal/lanlink", "./internal/routecat",
          ], env=env, check=True, timeout=8 * 60)
          PYTHON
      - name: Verify paired transport and Core applications over an isolated relay
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import subprocess
          import sys

          # Only this child test process receives a clean backend environment.
          # The test compiles out OS UDP and refuses non-loopback listeners.
          env = {k: v for k, v in os.environ.items()
                 if k.upper() not in ("HTTP_PROXY", "HTTPS_PROXY", "ALL_PROXY", "TS_PROXY")
                 and not k.upper().startswith("TS_")}
          env["SOBALINK_RUN_LAN_INTEGRATION"] = "1"
          subprocess.run([
              sys.executable, ".github/scripts/ci-go-test.py",
              "--expect", "github.com/webkaz-labs/sobalink/internal/lanlink:TestTrustedRelayTwoPeerIntegration",
              "--expect", "github.com/webkaz-labs/sobalink/internal/core:TestLANCorePeerApplicationsIntegration",
              "--expect", "github.com/webkaz-labs/sobalink/internal/core:TestLANCoreSavedHostStartIntegration",
              "--expect", "github.com/webkaz-labs/sobalink/internal/core:TestLANCoreDeviceCardPairingCompositionIntegration",
              "--expect", "github.com/webkaz-labs/sobalink/internal/routecat:TestMultipleRelayPresenceAndFreshClientRecovery",
              "--expect", "github.com/webkaz-labs/sobalink/internal/lanlink:TestManagedRelayCandidateFailoverIntegration",
              "--expect", "github.com/webkaz-labs/sobalink/internal/core:TestCoreTwoProcessRouteRecoveryIntegration",
              "--",
              "go", "test", "-count=1", "-v",
              "-tags=lanlink_integration,ts_omit_portmapper,ts_omit_captiveportal,ts_omit_useproxy,ts_omit_udptransport",
              "-run=^(TestTrustedRelayTwoPeerIntegration|TestLANCorePeerApplicationsIntegration|TestLANCoreSavedHostStartIntegration|TestLANCoreDeviceCardPairingCompositionIntegration|TestMultipleRelayPresenceAndFreshClientRecovery|TestManagedRelayCandidateFailoverIntegration|TestCoreTwoProcessRouteRecoveryIntegration)$",
              "-timeout=5m", "./internal/lanlink", "./internal/core", "./internal/routecat",
          ], env=env, check=True, timeout=9 * 60)
          PY
      - name: Verify recovery with the ordinary direct-enabled transport
        timeout-minutes: 9
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import os
          import subprocess
          import sys

          # Real production UDP behavior with synthetic peers and exactly two
          # pinned loopback TLS relays. No account or public bootstrap map.
          # This is distinct from the UDP-omitted relay-only proof above.
          env = {k: v for k, v in os.environ.items()
                 if k.upper() not in ("HTTP_PROXY", "HTTPS_PROXY", "ALL_PROXY", "TS_PROXY")
                 and not k.upper().startswith("TS_")}
          env["SOBALINK_RUN_DIRECT_INTEGRATION"] = "1"
          subprocess.run([
              sys.executable, ".github/scripts/ci-go-test.py",
              "--expect", "github.com/webkaz-labs/sobalink/internal/routecat:TestNormalBuildMultipleRelayTCPUDPRecoveryIntegration",
              "--expect", "github.com/webkaz-labs/sobalink/internal/core:TestCoreTwoProcessRouteRecoveryIntegration",
              "--",
              "go", "test", "-race", "-count=1", "-v",
              "-tags=lanlink_integration,ts_omit_portmapper,ts_omit_captiveportal,ts_omit_useproxy",
              "-run=^(TestNormalBuildMultipleRelayTCPUDPRecoveryIntegration|TestCoreTwoProcessRouteRecoveryIntegration)$",
              "-timeout=5m", "./internal/routecat", "./internal/core",
          ], env=env, check=True, timeout=8 * 60)
          PYTHON
      - name: Native vet and formatting
        run: |
          set -euo pipefail
          go vet ./... 2>&1 | tee logs/vet.txt
          unformatted="$(gofmt -l cmd internal)"
          test -z "$unformatted" || { printf '%s\n' "$unformatted" >&2; exit 1; }
      - name: Reproducible packages, license notices, and native archive smoke
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          go run ./cmd/package-tool build "$RELEASE_VERSION" "$TARGET_OS" "$TARGET_ARCH" "$TESTED_COMMIT" 2>&1 | tee logs/first-build.txt
          go run ./cmd/package-tool checksums
          cp dist/SHA256SUMS "$RUNNER_TEMP/first-SHA256SUMS"
          go run ./cmd/package-tool build "$RELEASE_VERSION" "$TARGET_OS" "$TARGET_ARCH" "$TESTED_COMMIT" 2>&1 | tee logs/second-build.txt
          go run ./cmd/package-tool checksums
          cmp "$RUNNER_TEMP/first-SHA256SUMS" dist/SHA256SUMS
          extension=tar.gz
          if [[ "$TARGET_OS" == windows ]]; then extension=zip; fi
          python .github/scripts/smoke-package.py "dist/sobalink-$RELEASE_VERSION-$TARGET_OS-$TARGET_ARCH.$extension" "$RELEASE_VERSION" 2>&1 | tee logs/package-smoke.txt
          # The combined checksum inventory is generated after all four builds.
          rm dist/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: prerelease-native-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Preserve independent target logs even after failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: prerelease-build-logs-${{ matrix.goos }}-${{ matrix.goarch }}
          path: logs/*
          if-no-files-found: warn
          retention-days: 14

  provenance:
    needs: [gate, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RELEASE_VERSION: ${{ needs.gate.outputs.version }}
      TESTED_COMMIT: ${{ needs.gate.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.gate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Locate Go module and compilation caches
        id: go-cache-info
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = go1.27.1
          echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      # Only main CI writes this namespace. Release restores the exact tested SHA;
      # GitHub's branch scope and the release gate exclude PR and branch caches.
      - name: Restore trusted main Go caches
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ steps.go-cache-info.outputs.gomodcache }}
            ${{ steps.go-cache-info.outputs.gocache }}
          key: trusted-main-go-v1-${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-go1.27.1-${{ hashFiles('go.mod', 'go.sum', 'internal/engineadaptation/**', 'internal/lifecycleadaptation/**', 'cmd/prepare-engine/**') }}-${{ needs.gate.outputs.commit }}
      - name: Report Go cache result and require an exact release key
        env:
          CACHE_PRIMARY_KEY: ${{ steps.go-cache.outputs.cache-primary-key }}
          CACHE_MATCHED_KEY: ${{ steps.go-cache.outputs.cache-matched-key }}
          CACHE_HIT: ${{ steps.go-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          printf 'Go cache exact hit: %s\nRequested key: %s\nMatched key: %s\n' "${CACHE_HIT:-miss}" "$CACHE_PRIMARY_KEY" "${CACHE_MATCHED_KEY:-none}"
          test -z "$CACHE_MATCHED_KEY" || test "$CACHE_MATCHED_KEY" = "$CACHE_PRIMARY_KEY"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: prerelease-native-*
          path: dist
          merge-multiple: true
      - name: Assemble and audit exact final distribution inputs
        shell: bash
        run: |
          set -euo pipefail
          go run ./cmd/prepare-engine
          go run ./cmd/prepare-engine --verify
          go mod verify
          go run ./cmd/package-tool manifest "$RELEASE_VERSION"
          go run ./cmd/package-tool checksums
          python .github/scripts/release-validation.py assets
      - name: Attest every final archive, SBOM, notice inventory, build metadata, manifest, and checksum file
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: prerelease-distribution-inputs
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  packslip:
    needs: [gate, provenance]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.gate.outputs.version }}
      TESTED_COMMIT: ${{ needs.gate.outputs.commit }}
    steps:
      # No source checkout, repository write permission, or persistent signing key.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: prerelease-distribution-inputs
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-validation-tools
          path: tools
      - name: Verify actual provenance before adding any attestation links
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/prerelease.yml@refs/heads/main"
          python tools/release-validation.py assets
          mkdir -p logs
          for file in dist/*; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --cert-identity "https://github.com/$GITHUB_WORKFLOW_REF" \
              --cert-oidc-issuer https://token.actions.githubusercontent.com \
              --source-digest "$TESTED_COMMIT" --source-ref refs/heads/main \
              --deny-self-hosted-runners 2>&1 | tee "logs/provenance-$(basename "$file").txt"
          done
      - name: Sign four native archives and their four SBOMs with GitHub OIDC
        id: packslip
        uses: jdx/packslip@87479dfc6443253dff69601cace5fc6ea07e6df5 # v1 / CLI 1.4.0
        with:
          packslip-version: '1.4.0'
          artifacts: dist/*.tar.gz dist/*.zip dist/*.cdx.json
          manifest: dist/packslip.toml
          project: github.com/webkaz-labs/sobalink
          version: ${{ needs.gate.outputs.version }}
          tag: ${{ needs.gate.outputs.tag }}
          commit: ${{ needs.gate.outputs.commit }}
          attest: link
          upload: false
      - name: Verify exact signing identity, source, manifest, and all signed digests
        shell: bash
        env:
          BUNDLE: ${{ steps.packslip.outputs.bundle }}
        run: |
          set -euo pipefail
          args=()
          for file in dist/*.tar.gz dist/*.zip dist/*.cdx.json; do args+=(--artifact "$file"); done
          packslip verify "$BUNDLE" --identity "https://github.com/$GITHUB_WORKFLOW_REF" \
            --issuer https://token.actions.githubusercontent.com "${args[@]}" 2>&1 | tee logs/packslip-verify.txt
          cp "$BUNDLE" dist/packslip.sigstore.json
          python tools/release-validation.py bundle
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: prerelease-packslip-bundle
          path: ${{ steps.packslip.outputs.bundle }}
          if-no-files-found: error
          retention-days: 14
      - name: Preserve signature and provenance verification logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: prerelease-signature-logs
          path: logs/*
          if-no-files-found: warn
          retention-days: 14

  bundle-provenance:
    needs: packslip
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: prerelease-packslip-bundle
          path: packslip
      - name: Attest the signature bundle without granting the signer release-write permission
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: packslip/packslip.sigstore.json

  stage:
    needs: [gate, provenance, bundle-provenance]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.gate.outputs.version }}
      TESTED_COMMIT: ${{ needs.gate.outputs.commit }}
      RELEASE_TAG: ${{ needs.gate.outputs.tag }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: prerelease-distribution-inputs
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-validation-tools
          path: tools
      - name: Recheck source and CI, create exact immutable tag, and stage an unpublished prerelease
        shell: bash
        run: |
          set -euo pipefail
          python tools/release-validation.py gate
          python tools/release-validation.py assets
          python - <<'PY'
          import importlib.util, json, os, subprocess
          spec = importlib.util.spec_from_file_location("checks", "tools/release-validation.py")
          checks = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(checks)
          version, commit = os.environ["RELEASE_VERSION"], os.environ["TESTED_COMMIT"]
          ref, release = checks.release_state(version, commit)
          tag = "v" + version
          def post(path, data):
              subprocess.run(["gh", "api", "--method", "POST", "repos/" + checks.REPOSITORY + "/" + path, "--input", "-"], input=json.dumps(data), text=True, check=True)
          if ref is None:
              post("git/refs", {"ref": "refs/tags/" + tag, "sha": commit})
          if release is None:
              notes = "\n".join([
                  "実験的なプレリリースです。安定版ではありません。",
                  "経路許可の縮小時は旧接続を保存前に停止します。保存失敗後はsobaを停止してください。以前の許可がディスクに残る可能性があるため、保存状態を確認・修正してから再起動してください。失敗した取消の永続性は保証しません。",
                  "sobalink（コマンド soba）は端末間でサービス・ファイル・メッセージを扱うツールです。ローカルのWeb画面とCLIを備え、既存Tailnetと明示指定した信頼できる中継先を利用するペア接続に対応します。",
                  "認証済みの同じペアで、個別に許可したLAN内・外部リレー候補の間を復旧します。経路の許可は任意の期限または取消までを明示して選び、既存の有限許可は自動延長しません。",
                  "既存TCP接続の無停止や途中バイトからの再送は保証しません。アプリケーションによる再接続が必要です。LAN内の候補を使っていても外部送信ゼロを保証するモードではありません。",
                  "必要な場合だけLANの送信先を明示的に制限できます。UDPは選択したCIDR、TCPは証明書を固定した中継のIPとポートだけを許可し、そのエンジンの補助的なネットワーク診断を停止します。",
                  "この制限は宛先の許可であり、NICやVPNの固定、プロセス全体の通信隔離ではありません。管理者権限、追加ドライバー、OSの経路やLANルーターの設定変更を前提にしません。",
                  "最初の中継設定は一度に検証・保存し、証明書の変更は明示的なローテーション操作で扱います。同じIPの別ポートは別の中継先として保持します。",
                  "明示的に選ぶ中継なしLAN接続は、指定した数値アドレスの相手とWireGuardおよびユーザー空間TCP/UDPで通信します。一度限りのペア設定で相手の識別鍵とトンネル鍵を結び付けます。",
                  "通常のLAN外接続にはTailscaleを推奨します。任意のWAN設定は、到達可能な互換中継を既に用意している場合の高度な機能として残します。外部中継の構築・配置は当面の対象外です。",
                  "WAN候補の探索は別の明示設定です。選択した数値STUN宛先への探索は調整可能な有限の処理予算で行い、任意のIPv6候補と許可済み中継へのフォールバックを利用できます。LAN宛先制限との同時利用はできません。",
                  "中継候補に4件の固定許可上限は設けず、保存形式の容量と調整可能な有限の接続・探索予算で資源を制限します。予算を増やしても相手や宛先への許可は広がりません。",
                  "複数バックエンドの切替には明示的な認証済みの相手の対応付けが必要です。同じ名前やIPだけでは同じ相手と判断せず、許可の拒否を別経路への切替理由にしません。",
                  "エンジン変更は元と変更後のハッシュを検証する小さなソース差分として管理します。配布物は従来どおり単一実行ファイルで、利用者の追加インストール手順はありません。",
                  "サービスの公開先・ポート・期限、ファイルの受信先と自動保存は明示的に選びます。保存済みサービスを起動時に自動公開しません。",
                  "3種類のOS、4対象環境でネイティブのrace test・vet・同一入力2回ビルド・日英の配布物smoke testを実行しました。正確なソースに対するPlaywrightの実ブラウザー試験はリンク先のCIで確認できます。",
                  "実機間のTailnet・ACL・アプリ互換性、スマートフォンQR、実際のIME・フォント、Windows Console／ConPTY、OSログイン・スリープは別途確認が必要です。模擬ピアと隔離されたループバック中継の試験は、実利用環境全体の保証ではありません。",
                  "公開後に4対象環境で実際のmiseインストールと署名・来歴を検証します。実機ネットワークでの確認は公開後も未検証として残ります。結果はこのリリースのActions実行で確認してください。",
                  "",
                  "Experimental prerelease; this is not a stable release.",
                  "Route permission reductions stop old connections before saving. After a save failure, stop soba: old permissions may remain on disk. Inspect and reconcile saved state before restarting; failed revocation is not guaranteed durable.",
                  "sobalink, with the soba command, connects devices for services, files and messages through a local Web UI and CLI. It supports an existing Tailnet and explicit peer pairing through a selected trusted relay.",
                  "The same authenticated pair can recover across individually approved LAN-local and external relay candidates. Route authorization has an explicitly chosen expiry or lasts until revoked; existing finite permissions are never automatically extended.",
                  "Established TCP connections may fail and applications must reconnect; partial-byte resumption is not provided. A LAN-local relay candidate is not a strict no-external-egress mode.",
                  "An optional LAN destination allowlist admits UDP only to selected CIDRs and TCP only to exact certificate-pinned relay IP:port destinations, while disabling auxiliary network diagnostics for that engine.",
                  "This is destination admission, not NIC/VPN binding or whole-process isolation. The product does not require administrator privileges, additional drivers, OS route changes or LAN-router configuration changes.",
                  "First relay setup is validated and saved atomically. Certificate changes use an explicit rotation operation, and different relay ports on the same IP keep their separate identities.",
                  "Explicit relayless LAN mode uses selected numeric peer endpoints with WireGuard and userspace TCP/UDP. One-use pairing binds each peer's identity key to its separate tunnel key.",
                  "Use Tailscale for ordinary outside-LAN connections. Optional WAN controls remain an advanced capability for an already reachable compatible relay; external relay construction and deployment are out of scope for now.",
                  "WAN discovery is a separate opt-in for selected numeric STUN destinations and/or native IPv6 candidates. STUN probes use an adjustable finite batch budget, with approved relay fallback retained. WAN discovery cannot be combined with a LAN destination policy.",
                  "Relay candidates have no fixed four-item permission ceiling. Storage-format capacity and adjustable finite connection/probe budgets bound resources; increasing a budget does not authorize additional peers or destinations.",
                  "Mixed-backend routing requires an explicit authenticated peer binding. Matching names or IPs never establish identity, and a denied route never triggers fallback to another backend.",
                  "The engine adaptation is retained as a small source patch with verified original and adapted hashes. Distribution remains a single executable with no additional end-user installation steps.",
                  "Service recipients, ports and lifetimes, receiving destinations and automatic saving are explicit choices. Saved services are not automatically exposed on startup.",
                  "Native race tests, vet, matching repeated builds and bilingual archive smoke tests ran on four targets across three operating systems. See the linked exact-source CI for Playwright browser acceptance.",
                  "Real-device Tailnet/ACL/application compatibility, phone QR, actual IME/font combinations, Windows Console/ConPTY, OS login and suspend remain separate acceptance checks. Synthetic peers and an isolated loopback relay do not establish compatibility with every real environment.",
                  "Actual mise installation and public signatures/provenance are checked on all four targets after publication. Physical-device network acceptance remains unverified after release; inspect this release's Actions run for the results.",
                  "",
                  "Verification: https://github.com/" + checks.REPOSITORY + "/actions/runs/" + os.environ["GITHUB_RUN_ID"],
                  "Source commit: " + commit,
                  "<!-- sobalink-source:" + commit + " -->",
              ])
              post("releases", {"tag_name": tag, "target_commitish": commit, "name": tag + " (experimental)", "body": notes, "draft": True, "prerelease": True, "make_latest": "false"})
          PY
          python tools/release-validation.py draft
          gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    needs: [gate, stage, bundle-provenance]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.gate.outputs.version }}
      TESTED_COMMIT: ${{ needs.gate.outputs.commit }}
      RELEASE_TAG: ${{ needs.gate.outputs.tag }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: prerelease-distribution-inputs
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: prerelease-packslip-bundle
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-validation-tools
          path: tools
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ci-full-validation-proof
          path: proof
      - name: Publish only the verified draft at the exact source commit
        shell: bash
        run: |
          set -euo pipefail
          python tools/release-validation.py draft
          gh attestation verify dist/packslip.sigstore.json --repo "$GITHUB_REPOSITORY" \
            --cert-identity "https://github.com/$GITHUB_WORKFLOW_REF" \
            --cert-oidc-issuer https://token.actions.githubusercontent.com \
            --source-digest "$TESTED_COMMIT" --source-ref refs/heads/main --deny-self-hosted-runners
          gh release upload "$RELEASE_TAG" dist/packslip.sigstore.json --repo "$GITHUB_REPOSITORY" --clobber
          python tools/release-validation.py publish-ready --proof proof/ci-full-proof.json --revalidated-proof proof/publication-full-proof.json
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
      - name: Preserve publication-time full-CI proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: publication-ci-full-validation-proof
          path: proof/publication-full-proof.json
          if-no-files-found: warn
          retention-days: 90


  verify-published:
    needs: [gate, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      MISE_GITHUB_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.gate.outputs.version }}
      TESTED_COMMIT: ${{ needs.gate.outputs.commit }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-validation-tools
          path: tools
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: '2026.9.18'
          install: false
          cache: false
      - name: Download all published assets without authentication and verify Packslip and provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs
          python tools/release-validation.py download-public --root public-dist 2>&1 | tee logs/public-download.txt
          mise install github:jdx/packslip@1.4.0
          args=()
          for file in public-dist/*.tar.gz public-dist/*.zip public-dist/*.cdx.json; do args+=(--artifact "$file"); done
          mise exec github:jdx/packslip@1.4.0 -- packslip verify public-dist/packslip.sigstore.json \
            --identity "https://github.com/$GITHUB_WORKFLOW_REF" \
            --issuer https://token.actions.githubusercontent.com "${args[@]}" 2>&1 | tee logs/public-packslip.txt
          python tools/release-validation.py bundle --root public-dist
          for file in public-dist/*; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --cert-identity "https://github.com/$GITHUB_WORKFLOW_REF" \
              --cert-oidc-issuer https://token.actions.githubusercontent.com \
              --source-digest "$TESTED_COMMIT" --source-ref refs/heads/main \
              --deny-self-hosted-runners 2>&1 | tee "logs/public-provenance-$(basename "$file").txt"
          done
      - name: Preserve public download and independent signature/provenance results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: prerelease-public-verification
          path: logs/*
          if-no-files-found: warn
          retention-days: 14

  verify-mise-install:
    needs: [gate, verify-published]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-amd64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-26
            target: darwin-arm64
          - runner: windows-2025
            target: windows-amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.gate.outputs.version }}
      TESTED_COMMIT: ${{ needs.gate.outputs.commit }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-validation-tools
          path: tools
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: '2026.9.18'
          install: false
          cache: false
      - name: Actually install the exact prerelease through Packslip and inspect installed files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs
          # Exact versions intentionally use mise's built-in explicit-version policy.
          # No age override, signature bypass, test key, or disabled verification.
          tool="packslip:github.com/${GITHUB_REPOSITORY}[prerelease=true]@${RELEASE_VERSION}"
          mise --version 2>&1 | tee logs/mise-version.txt
          mise install "$tool" 2>&1 | tee logs/mise-install.txt
          mise use -g "$tool" 2>&1 | tee logs/mise-use-global.txt
          mise exec -- soba version 2>&1 | tee logs/installed-version.txt
          mise exec -- soba --help 2>&1 | tee logs/installed-help.txt
          install_dir="$(mise where "$tool")"
          python tools/verify-installed.py "$install_dir" "$RELEASE_VERSION" "$TESTED_COMMIT" "$TARGET" 2>&1 | tee logs/installed-notices.txt
      - name: Preserve each native mise installation result even after failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: prerelease-mise-install-${{ matrix.target }}
          path: logs/*
          if-no-files-found: warn
          retention-days: 14
