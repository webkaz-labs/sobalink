name: Cross-platform CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      force_full:
        description: Run every native, browser and package check
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # A documentation push must not cancel application validation on main.
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: local
  GOWORK: 'off'
  GOFLAGS: -mod=readonly -tags=ts_omit_portmapper,ts_omit_captiveportal,ts_omit_useproxy

jobs:
  impact:
    outputs:
      scope: ${{ steps.selection.outputs.scope }}
    # Prove the complete event delta. No prior test receipts are reused.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select minimum CI scope
        id: selection
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.force_full || false }}
        run: python .github/scripts/ci-coverage.py plan --output "$RUNNER_TEMP/ci-impact-plan.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-impact-plan
          path: ${{ runner.temp }}/ci-impact-plan.json
          if-no-files-found: error
          retention-days: 14

  native:
    # Unknown or failed selection defaults to the full native matrix.
    needs: impact
    if: always() && !cancelled() && github.event.repository.private == false && needs.impact.outputs.scope != 'docs' && needs.impact.outputs.scope != 'frontend' && needs.impact.outputs.scope != 'go'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-26
            goos: darwin
            goarch: arm64
          - runner: windows-2025
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.runner }}
    # Preserve per-gate bounds while allowing the complete native/package chain.
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download this run's impact plan
        if: needs.impact.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ci-impact-plan
          path: ${{ runner.temp }}/ci-plan
      - name: Validate impact plan or require full coverage
        id: ci-plan
        run: python .github/scripts/ci-coverage.py resolve --input "$RUNNER_TEMP/ci-plan/ci-impact-plan.json" --output "$RUNNER_TEMP/ci-impact-plan.json"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
          check-latest: false
      - name: Test and reproduce locked frontend assets
        run: |
          npm install --global npm@11.9.0 --no-audit --no-fund
          python .github/scripts/check-frontend.py
      - name: Locate Go module and compilation caches
        id: go-cache-info
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = go1.27.1
          echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - name: Select isolated development Go cache scope
        id: development-go-cache-scope
        run: |
          python - <<'PYTHON'
          import hashlib
          import json
          import os

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as source:
              event = json.load(source)
          repository = os.environ["GITHUB_REPOSITORY"]
          event_name = os.environ["GITHUB_EVENT_NAME"]
          ref = os.environ["GITHUB_REF"]
          metadata = event.get("repository") or {}
          scope = ""
          if (repository == "webkaz-labs/sobalink"
                  and metadata.get("full_name") == repository
                  and metadata.get("default_branch") == "main"
                  and metadata.get("private") is False):
              if (event_name == "workflow_dispatch" and ref.startswith("refs/heads/")
                      and ref not in ("refs/heads/", "refs/heads/main")):
                  # Fixed-width ref hashes prevent crafted branch names from
                  # overlapping another branch's fallback prefix.
                  scope = "branch-" + hashlib.sha256(ref.encode("utf-8")).hexdigest()
              elif event_name == "pull_request":
                  number = event.get("number")
                  pull = event.get("pull_request") or {}
                  head = (pull.get("head") or {}).get("repo") or {}
                  base = (pull.get("base") or {}).get("repo") or {}
                  if (type(number) is int and number > 0
                          and pull.get("number") == number
                          and ref == f"refs/pull/{number}/merge"
                          and head.get("full_name") == repository
                          and base.get("full_name") == repository):
                      scope = f"pr-{number}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"scope={scope}", file=output)
          PYTHON
      # Only main CI writes this namespace. Release restores the exact tested SHA;
      # GitHub's branch scope and the release gate exclude PR and branch caches.
      - name: Restore trusted main Go caches
        id: go-cache
        if: github.repository == 'webkaz-labs/sobalink' && github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ steps.go-cache-info.outputs.gomodcache }}
            ${{ steps.go-cache-info.outputs.gocache }}
          key: trusted-main-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.runner }}-go1.27.1-${{ hashFiles('go.mod', 'go.sum', 'internal/engineadaptation/**', 'internal/lifecycleadaptation/**', 'cmd/prepare-engine/**') }}-${{ github.sha }}
          # Reuse only identical runner, toolchain, and dependency manifests.
          restore-keys: trusted-main-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.runner }}-go1.27.1-${{ hashFiles('go.mod', 'go.sum', 'internal/engineadaptation/**', 'internal/lifecycleadaptation/**', 'cmd/prepare-engine/**') }}-
      # Development caches never restore from or save to trusted-main keys.
      - name: Restore isolated development Go caches
        id: development-go-cache
        if: steps.development-go-cache-scope.outputs.scope != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ steps.go-cache-info.outputs.gomodcache }}
            ${{ steps.go-cache-info.outputs.gocache }}
          key: development-go-v1-webkaz-labs-sobalink-${{ steps.development-go-cache-scope.outputs.scope }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.runner }}-go1.27.1-${{ hashFiles('go.mod', 'go.sum', 'internal/engineadaptation/**', 'internal/lifecycleadaptation/**', 'cmd/prepare-engine/**') }}-${{ github.sha }}
          restore-keys: development-go-v1-webkaz-labs-sobalink-${{ steps.development-go-cache-scope.outputs.scope }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.runner }}-go1.27.1-${{ hashFiles('go.mod', 'go.sum', 'internal/engineadaptation/**', 'internal/lifecycleadaptation/**', 'cmd/prepare-engine/**') }}-
      - name: Report Go cache results
        if: always()
        env:
          MAIN_CACHE_OUTCOME: ${{ steps.go-cache.outcome }}
          MAIN_CACHE_PRIMARY_KEY: ${{ steps.go-cache.outputs.cache-primary-key }}
          MAIN_CACHE_MATCHED_KEY: ${{ steps.go-cache.outputs.cache-matched-key }}
          MAIN_CACHE_HIT: ${{ steps.go-cache.outputs.cache-hit }}
          DEVELOPMENT_CACHE_OUTCOME: ${{ steps.development-go-cache.outcome }}
          DEVELOPMENT_CACHE_PRIMARY_KEY: ${{ steps.development-go-cache.outputs.cache-primary-key }}
          DEVELOPMENT_CACHE_MATCHED_KEY: ${{ steps.development-go-cache.outputs.cache-matched-key }}
          DEVELOPMENT_CACHE_HIT: ${{ steps.development-go-cache.outputs.cache-hit }}
        run: |
          python - <<'PYTHON'
          import os

          for namespace in ("MAIN", "DEVELOPMENT"):
              outcome = os.environ.get(f"{namespace}_CACHE_OUTCOME", "")
              primary = os.environ.get(f"{namespace}_CACHE_PRIMARY_KEY", "")
              matched = os.environ.get(f"{namespace}_CACHE_MATCHED_KEY", "")
              exact_output = os.environ.get(f"{namespace}_CACHE_HIT", "")
              if outcome in ("", "skipped"):
                  result = "skipped"
              elif outcome != "success":
                  result = f"restore {outcome}"
              elif not matched:
                  result = "miss"
              elif matched == primary:
                  result = "exact hit"
              else:
                  result = "fallback hit"
              print(f"{namespace.lower()} Go cache: {result}\nRequested key: {primary or 'none'}\nMatched key: {matched or 'none'}\nAction exact-hit output: {exact_output or 'unset'}")
          PYTHON
      - name: Check exact toolchain and native target
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = go1.27.1
          test "$(go env GOOS)" = '${{ matrix.goos }}'
          test "$(go env GOARCH)" = '${{ matrix.goarch }}'
          go run ./cmd/prepare-engine
          go run ./cmd/prepare-engine --verify
          go mod verify
          python -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Verify Windows receive-retirement directory barriers
        if: matrix.goos == 'windows'
        run: go test -race -count=1 -v -timeout=2m -run '^TestWindowsRetirementDirectoryBarrierProbe$' ./internal/transfer
      - name: Local and mock tests, race detector, and vet
        run: |
          set -euo pipefail
          python .github/scripts/ci-metrics.py run --suite local-race -- go test -race -count=1 -timeout=10m ./...
          # Enforce offline route-revocation recovery using the real protected fixture.
          python .github/scripts/ci-metrics.py run --suite offline-route-race -- go test -race -count=1 -tags=soba_e2e,ts_omit_portmapper,ts_omit_captiveportal,ts_omit_useproxy -run='^TestRoute(BrowserFixture|OfflineFailed)' -timeout=2m ./internal/core
          python .github/scripts/ci-metrics.py run --suite backend-route-race -- go test -race -count=1 -timeout=3m ./internal/backendworker ./internal/connectionroute
          python .github/scripts/ci-metrics.py run --suite mixed-core-race -- go test -race -count=1 -timeout=3m ./internal/core -run '^TestMixed'
          # Repeat real native IPC cleanup; exact timer policy is tested virtually.
          python .github/scripts/ci-metrics.py run --suite ipc-repeat-race -- go test -race -count=5 -timeout=2m ./internal/control
          python .github/scripts/ci-metrics.py run --suite native-vet -- go vet ./...
          unformatted="$(gofmt -l cmd internal web)"
          if [[ -n "$unformatted" ]]; then
            printf 'Go files need gofmt (check checkout line endings):\n%s\n' "$unformatted" >&2
            exit 1
          fi
      - name: Verify adapted engine admission and native underlay denial
        timeout-minutes: 20
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import os
          import subprocess

          # Upstream test-only dependencies stay in the original immutable
          # upstream module graph; product tests use the product graph above.
          env = {k: v for k, v in os.environ.items()
                 if k.upper() not in ("HTTP_PROXY", "HTTPS_PROXY", "ALL_PROXY", "TS_PROXY")
                 and not k.upper().startswith("TS_")}
          env["SOBALINK_RUN_UNDERLAY_NATIVE"] = "1"
          base = ["go", "test", "-mod=readonly", "-race", "-count=1", "-v", "-timeout=5m",
                  "-tags=ts_omit_portmapper,ts_omit_captiveportal,ts_omit_useproxy"]
          subprocess.run(base + ["./net/underlayguard"],
                         cwd=".sobalink-deps/tailscale", env=env, check=True, timeout=5 * 60)
          subprocess.run(base + ["-run=^Test(UnderlayGuard|WANCandidate|Sobalink|GuardedLocalSocketEndpointUsesActualFamilyPort)", "./wgengine", "./wgengine/magicsock", "./derp", "./derp/derphttp", "./net/netcheck"],
                         cwd=".sobalink-deps/tailscale", env=env, check=True, timeout=5 * 60)
          PYTHON
          python .github/scripts/underlay-negative-controls.py --source .sobalink-deps/tailscale
          go run ./cmd/prepare-engine --verify
      - name: Verify Core context control over pinned TLS
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python .github/scripts/ci-metrics.py run --suite context-core-tls -- python .github/scripts/ci-context-control.py core-tls
      - name: Verify context control over fixed loopback TCP
        timeout-minutes: 2
        run: |
          set -euo pipefail
          python .github/scripts/ci-metrics.py run --suite context-fixed-tcp -- python .github/scripts/ci-context-control.py fixed-tcp
      - name: Verify managed session tls
        timeout-minutes: 4
        run: |
          set -euo pipefail
          python .github/scripts/ci-metrics.py run --suite managed-session-tls -- python .github/scripts/ci-managed-session.py tls
      - name: Verify managed session outbound-tcp
        timeout-minutes: 4
        run: |
          set -euo pipefail
          python .github/scripts/ci-metrics.py run --suite managed-session-outbound-tcp -- python .github/scripts/ci-managed-session.py outbound-tcp
      - name: Verify managed session native-caller
        timeout-minutes: 4
        run: |
          set -euo pipefail
          python .github/scripts/ci-metrics.py run --suite managed-session-native-caller -- python .github/scripts/ci-managed-session.py native-caller
      - name: Verify managed session native-simultaneous
        timeout-minutes: 4
        run: |
          set -euo pipefail
          python .github/scripts/ci-metrics.py run --suite managed-session-native-simultaneous -- python .github/scripts/ci-managed-session.py native-simultaneous
      - name: Verify managed session native-udp-capacity
        timeout-minutes: 4
        run: |
          set -euo pipefail
          python .github/scripts/ci-metrics.py run --suite managed-session-native-udp-capacity -- python .github/scripts/ci-managed-session.py native-udp-capacity
      - name: Verify managed activation acceptance
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python .github/scripts/ci-metrics.py run --suite managed-activation -- python .github/scripts/ci-managed-activation.py activation
      - name: Verify managed restart acceptance
        timeout-minutes: 4
        run: |
          set -euo pipefail
          python .github/scripts/ci-metrics.py run --suite managed-restart -- python .github/scripts/ci-managed-activation.py restart
      - name: Verify direct LAN WireGuard and Core native applications
        timeout-minutes: 9
        run: |
          set -euo pipefail
          python .github/scripts/ci-metrics.py run --suite directlan-repeat-race -- go test -race -count=2 -v -timeout=3m -tags=directlan_integration,ts_omit_portmapper,ts_omit_captiveportal,ts_omit_useproxy ./internal/directlan
          python .github/scripts/ci-metrics.py run --suite directlan-vet -- go vet -tags=directlan_integration,ts_omit_portmapper,ts_omit_captiveportal,ts_omit_useproxy ./internal/directlan
          python .github/scripts/ci-metrics.py run --suite directlan-core-repeat-race -- go test -race -count=5 -timeout=5m -tags=directlan_integration,ts_omit_portmapper,ts_omit_captiveportal,ts_omit_useproxy -run='^TestDirectLAN' ./internal/core
      - name: Verify direct LAN synthetic expiry and rekey
        timeout-minutes: 3
        run: |
          set -euo pipefail
          python .github/scripts/ci-metrics.py run --suite synthetic-expiry-rekey -- python .github/scripts/ci-go-test.py --expect github.com/webkaz-labs/sobalink/internal/directlan:TestNativeSessionSyntheticExpiryRekey -- go test -race -count=1 -timeout=2m -tags=directlan_integration,directlan_lifecycle,ts_omit_portmapper,ts_omit_captiveportal,ts_omit_useproxy -run='^TestNativeSessionSyntheticExpiryRekey$' ./internal/directlan
      - name: Verify direct LAN session natural rekey and idle lifecycle
        if: steps.ci-plan.outputs.long_required != 'false'
        timeout-minutes: 9
        run: |
          set -euo pipefail
          python .github/scripts/ci-metrics.py run --suite natural-lifecycle -- python .github/scripts/ci-go-test.py --expect github.com/webkaz-labs/sobalink/internal/directlan:TestNativeSessionLifecycle --expect github.com/webkaz-labs/sobalink/internal/directlan:TestNativeSessionLifecycle/active-through-natural-rekey --expect github.com/webkaz-labs/sobalink/internal/directlan:TestNativeSessionLifecycle/idle-through-natural-expiry-new-dial -- go test -race -count=1 -timeout=8m -tags=directlan_integration,directlan_lifecycle,ts_omit_portmapper,ts_omit_captiveportal,ts_omit_useproxy -run='^TestNativeSessionLifecycle$' ./internal/directlan
      - name: Verify explicit WAN discovery with isolated native STUN
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import os
          import subprocess
          import sys

          # Synthetic native loopback fixture only; this does not establish
          # real NAT traversal, physical IPv6 routes, or device acceptance.
          env = {k: v for k, v in os.environ.items()
                 if k.upper() not in ("HTTP_PROXY", "HTTPS_PROXY", "ALL_PROXY", "TS_PROXY")
                 and not k.upper().startswith("TS_")}
          env["SOBALINK_RUN_WAN_INTEGRATION"] = "1"
          subprocess.run([
              sys.executable, ".github/scripts/ci-go-test.py",
              "--expect", "github.com/webkaz-labs/sobalink/internal/routecat:TestWANCandidateNativeLoopbackSTUN",
              "--",
              "go", "test", "-race", "-count=1", "-v", "-timeout=120s",
              "-tags=lanlink_integration,ts_omit_portmapper,ts_omit_captiveportal,ts_omit_useproxy",
              "-run=^TestWANCandidateNativeLoopbackSTUN$", "./internal/routecat",
          ], env=env, check=True, timeout=4 * 60)
          PYTHON
      - name: Verify guarded production direct and relay underlays
        timeout-minutes: 9
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import os
          import subprocess
          import sys

          # Normal production build with explicit synthetic loopback grants.
          # Clear overrides only for the child test process, never the runner.
          env = {k: v for k, v in os.environ.items()
                 if k.upper() not in ("HTTP_PROXY", "HTTPS_PROXY", "ALL_PROXY", "TS_PROXY")
                 and not k.upper().startswith("TS_")}
          env["SOBALINK_RUN_GUARDED_INTEGRATION"] = "1"
          subprocess.run([
              sys.executable, ".github/scripts/ci-go-test.py",
              "--expect", "github.com/webkaz-labs/sobalink/internal/lanlink:TestGuardedRelayTwoPeerFunctionalIntegration",
              "--expect", "github.com/webkaz-labs/sobalink/internal/routecat:TestGuardedDirectEncryptedTCPUDPIntegration",
              "--expect", "github.com/webkaz-labs/sobalink/internal/routecat:TestGuardedDERPFailurePropagationIntegration",
              "--",
              "go", "test", "-race", "-count=1", "-v",
              "-tags=lanlink_integration,ts_omit_portmapper,ts_omit_captiveportal,ts_omit_useproxy",
              "-run=^(TestGuardedRelayTwoPeerFunctionalIntegration|TestGuardedDirectEncryptedTCPUDPIntegration|TestGuardedDERPFailurePropagationIntegration)$",
              "-timeout=5m", "./internal/lanlink", "./internal/routecat",
          ], env=env, check=True, timeout=8 * 60)
          PYTHON
      - name: Verify paired transport and Core applications over an isolated relay
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import subprocess
          import sys

          # Only this child test process receives a clean backend environment.
          # The test compiles out OS UDP and refuses non-loopback listeners.
          env = {k: v for k, v in os.environ.items()
                 if k.upper() not in ("HTTP_PROXY", "HTTPS_PROXY", "ALL_PROXY", "TS_PROXY")
                 and not k.upper().startswith("TS_")}
          env["SOBALINK_RUN_LAN_INTEGRATION"] = "1"
          subprocess.run([
              sys.executable, ".github/scripts/ci-go-test.py",
              "--expect", "github.com/webkaz-labs/sobalink/internal/lanlink:TestTrustedRelayTwoPeerFunctionalIntegration",
              "--expect", "github.com/webkaz-labs/sobalink/internal/core:TestLANCorePeerApplicationsIntegration",
              "--expect", "github.com/webkaz-labs/sobalink/internal/core:TestLANCoreSavedHostStartIntegration",
              "--expect", "github.com/webkaz-labs/sobalink/internal/core:TestLANCoreDeviceCardPairingCompositionIntegration",
              "--expect", "github.com/webkaz-labs/sobalink/internal/routecat:TestMultipleRelayPresenceAndFreshClientFunctionalRecovery",
              "--expect", "github.com/webkaz-labs/sobalink/internal/lanlink:TestManagedRelayCandidateFailoverIntegration",
              "--expect", "github.com/webkaz-labs/sobalink/internal/core:TestCoreTwoProcessRouteRecoveryIntegration",
              "--",
              "go", "test", "-count=1", "-v",
              "-tags=lanlink_integration,ts_omit_portmapper,ts_omit_captiveportal,ts_omit_useproxy,ts_omit_udptransport",
              "-run=^(TestTrustedRelayTwoPeerFunctionalIntegration|TestLANCorePeerApplicationsIntegration|TestLANCoreSavedHostStartIntegration|TestLANCoreDeviceCardPairingCompositionIntegration|TestMultipleRelayPresenceAndFreshClientFunctionalRecovery|TestManagedRelayCandidateFailoverIntegration|TestCoreTwoProcessRouteRecoveryIntegration)$",
              "-timeout=5m", "./internal/lanlink", "./internal/core", "./internal/routecat",
          ], env=env, check=True, timeout=9 * 60)
          PY
      - name: Verify recovery with the ordinary direct-enabled transport
        timeout-minutes: 9
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import os
          import subprocess
          import sys

          # Real production UDP behavior with synthetic peers and exactly two
          # pinned loopback TLS relays. No account or public bootstrap map.
          # This is distinct from the UDP-omitted relay-only proof above.
          env = {k: v for k, v in os.environ.items()
                 if k.upper() not in ("HTTP_PROXY", "HTTPS_PROXY", "ALL_PROXY", "TS_PROXY")
                 and not k.upper().startswith("TS_")}
          env["SOBALINK_RUN_DIRECT_INTEGRATION"] = "1"
          subprocess.run([
              sys.executable, ".github/scripts/ci-go-test.py",
              "--expect", "github.com/webkaz-labs/sobalink/internal/routecat:TestNormalBuildMultipleRelayTCPUDPRecoveryIntegration",
              "--expect", "github.com/webkaz-labs/sobalink/internal/core:TestCoreTwoProcessRouteRecoveryIntegration",
              "--",
              "go", "test", "-race", "-count=1", "-v",
              "-tags=lanlink_integration,ts_omit_portmapper,ts_omit_captiveportal,ts_omit_useproxy",
              "-run=^(TestNormalBuildMultipleRelayTCPUDPRecoveryIntegration|TestCoreTwoProcessRouteRecoveryIntegration)$",
              "-timeout=5m", "./internal/routecat", "./internal/core",
          ], env=env, check=True, timeout=8 * 60)
          PYTHON
      - name: Verify guarded relay real-time lease continuity
        if: steps.ci-plan.outputs.long_required != 'false'
        timeout-minutes: 9
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import os
          import subprocess
          import sys

          env = {k: v for k, v in os.environ.items()
                 if k.upper() not in ("HTTP_PROXY", "HTTPS_PROXY", "ALL_PROXY", "TS_PROXY")
                 and not k.upper().startswith("TS_")}
          env["SOBALINK_RUN_GUARDED_INTEGRATION"] = "1"
          subprocess.run([
              sys.executable, ".github/scripts/ci-go-test.py",
              "--expect", "github.com/webkaz-labs/sobalink/internal/lanlink:TestGuardedRelayTwoPeerIntegration",
              "--",
              "go", "test", "-race", "-count=1", "-v",
              "-tags=lanlink_integration,ts_omit_portmapper,ts_omit_captiveportal,ts_omit_useproxy",
              "-run=^TestGuardedRelayTwoPeerIntegration$", "-timeout=5m", "./internal/lanlink",
          ], env=env, check=True, timeout=8 * 60)
          PYTHON
      - name: Verify relay-only real-time lease and idle continuity
        if: steps.ci-plan.outputs.long_required != 'false'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import os
          import subprocess
          import sys

          env = {k: v for k, v in os.environ.items()
                 if k.upper() not in ("HTTP_PROXY", "HTTPS_PROXY", "ALL_PROXY", "TS_PROXY")
                 and not k.upper().startswith("TS_")}
          env["SOBALINK_RUN_LAN_INTEGRATION"] = "1"
          # Preserve Go package-level concurrency for the 130s lease and 80s idle gates.
          subprocess.run([
              sys.executable, ".github/scripts/ci-go-test.py",
              "--expect", "github.com/webkaz-labs/sobalink/internal/lanlink:TestTrustedRelayTwoPeerIntegration",
              "--expect", "github.com/webkaz-labs/sobalink/internal/routecat:TestMultipleRelayPresenceAndFreshClientRecovery",
              "--",
              "go", "test", "-count=1", "-v",
              "-tags=lanlink_integration,ts_omit_portmapper,ts_omit_captiveportal,ts_omit_useproxy,ts_omit_udptransport",
              "-run=^(TestTrustedRelayTwoPeerIntegration|TestMultipleRelayPresenceAndFreshClientRecovery)$",
              "-timeout=5m", "./internal/lanlink", "./internal/routecat",
          ], env=env, check=True, timeout=9 * 60)
          PYTHON
      - name: Build native package and smoke archive contents
        run: |
          set -euo pipefail
          version="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          commit="$(git rev-parse HEAD)"
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          go run ./cmd/package-tool build "$version" '${{ matrix.goos }}' '${{ matrix.goarch }}' "$commit"
          go run ./cmd/package-tool checksums
          if [[ '${{ matrix.goos }}' == windows ]]; then
            extension=zip
          else
            extension=tar.gz
          fi
          python .github/scripts/smoke-package.py "dist/sobalink-$version-${{ matrix.goos }}-${{ matrix.goarch }}.$extension" "$version"
          # Per-target checksum names avoid collisions when matrix artifacts merge.
          mv dist/SHA256SUMS "dist/SHA256SUMS-${{ matrix.goos }}-${{ matrix.goarch }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: package-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Save Go caches after all native checks pass on main
        if: success() && steps.ci-plan.outputs.long_required != 'false' && github.repository == 'webkaz-labs/sobalink' && github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ steps.go-cache-info.outputs.gomodcache }}
            ${{ steps.go-cache-info.outputs.gocache }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
      - name: Save development Go caches after all native checks pass
        if: success() && steps.development-go-cache-scope.outputs.scope != '' && steps.development-go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ steps.go-cache-info.outputs.gomodcache }}
            ${{ steps.go-cache-info.outputs.gocache }}
          key: ${{ steps.development-go-cache.outputs.cache-primary-key }}

      - name: Summarize measured native suites
        if: always()
        run: python .github/scripts/ci-metrics.py summary --output "$RUNNER_TEMP/ci-suite-metrics.json"
      - name: Preserve native suite timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-timings-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ runner.temp }}/ci-suite-metrics.json
          if-no-files-found: error
          retention-days: 14

  manifest-smoke:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Locate Go module and compilation caches
        id: go-cache-info
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = go1.27.1
          echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      # Only main CI writes this namespace. Release restores the exact tested SHA;
      # GitHub's branch scope and the release gate exclude PR and branch caches.
      - name: Restore trusted main Go caches
        id: go-cache
        if: github.repository == 'webkaz-labs/sobalink' && github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ steps.go-cache-info.outputs.gomodcache }}
            ${{ steps.go-cache-info.outputs.gocache }}
          key: trusted-main-go-v1-${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-go1.27.1-${{ hashFiles('go.mod', 'go.sum', 'internal/engineadaptation/**', 'internal/lifecycleadaptation/**', 'cmd/prepare-engine/**') }}-${{ github.sha }}
      - name: Report Go cache result and require an exact source key
        if: github.repository == 'webkaz-labs/sobalink' && github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          CACHE_PRIMARY_KEY: ${{ steps.go-cache.outputs.cache-primary-key }}
          CACHE_MATCHED_KEY: ${{ steps.go-cache.outputs.cache-matched-key }}
          CACHE_HIT: ${{ steps.go-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          printf 'Go cache exact hit: %s\nRequested key: %s\nMatched key: %s\n' "${CACHE_HIT:-miss}" "$CACHE_PRIMARY_KEY" "${CACHE_MATCHED_KEY:-none}"
          test -z "$CACHE_MATCHED_KEY" || test "$CACHE_MATCHED_KEY" = "$CACHE_PRIMARY_KEY"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Prepare complete Packslip signing input and checksums
        run: |
          set -euo pipefail
          go run ./cmd/prepare-engine
          go run ./cmd/prepare-engine --verify
          go mod verify
          go run ./cmd/package-tool manifest "0.0.0-dev.${GITHUB_RUN_NUMBER}"
          go run ./cmd/package-tool checksums
          (cd dist && sha256sum --check SHA256SUMS)
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: '2026.9.18'
          install: false
          cache: false
      - name: Exercise signing and verification offline with a disposable test key
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mise install github:jdx/packslip@1.4.0
          keydir="$(mktemp -d "$RUNNER_TEMP/packslip-test.XXXXXX")"
          trap 'rm -rf "$keydir"' EXIT
          mkdir -p "$keydir/bundle"
          mise exec github:jdx/packslip@1.4.0 -- packslip keygen --out "$keydir/fixture.key"
          # The reserved example domain prevents this fixture from claiming the
          # production project identity. No transparency-log entry is created.
          mise exec github:jdx/packslip@1.4.0 -- packslip create \
            --manifest dist/packslip.toml \
            --project sobalink-ci.example.com \
            --url-base https://sobalink-ci.example.com/test-only \
            --key "$keydir/fixture.key" --no-log --out "$keydir/bundle"
          args=()
          for file in dist/*.tar.gz dist/*.zip dist/*.cdx.json; do
            args+=(--artifact "$file")
          done
          mise exec github:jdx/packslip@1.4.0 -- packslip verify \
            "$keydir/bundle/packslip.sigstore.json" \
            --pubkey "$keydir/fixture.pub" --allow-unlogged "${args[@]}"
          mise exec github:jdx/packslip@1.4.0 -- packslip show "$keydir/bundle/packslip.sigstore.json"
          # Test keys and bundles are intentionally not persisted or uploaded.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: distribution-inputs-not-a-release
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  web-activation:
    # Independent draft-PR validation; no default-branch registration required.
    # The existing workflow_dispatch/force_full route is an additional entry.
    # Endpoint-following acceptance is deliberately excluded from this job.
    if: github.event.repository.private == false && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && inputs.force_full))
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
          check-latest: false
      - name: Prepare locked dependencies and official Chromium
        timeout-minutes: 10
        run: |
          set -euo pipefail
          npm install --global npm@11.9.0 --no-audit --no-fund
          npm --prefix web ci --no-audit --no-fund
          node web/node_modules/@playwright/test/cli.js install --with-deps chromium
          go run ./cmd/prepare-engine
          go run ./cmd/prepare-engine --verify
          # Fetch only the versions explicitly pinned in the main module.
          # Broad "all" also pulls unrelated transitive test/tool graphs.
          go mod download
          go list -mod=readonly -deps -test -tags=ts_omit_portmapper,ts_omit_captiveportal,ts_omit_useproxy,managed_restart_native,web_activation_native ./cmd/soba >/dev/null
          git diff --exit-code -- go.mod go.sum
          go mod verify
      - name: Verify fixed Web acceptance policy
        run: python -m unittest discover -s .github/scripts -p 'test_ci_web_activation.py' -v
      - name: Compile and run seven private synthetic-owner cases
        id: web-activation
        timeout-minutes: 40
        run: python .github/scripts/ci-web-activation.py
      - name: Preserve only reconstructed sanitized acceptance evidence
        if: always() && steps.web-activation.outputs.sanitized_ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: soba-web-activation-sanitized
          path: |
            ${{ runner.temp }}/soba-web-activation-sanitized/result.json
            ${{ runner.temp }}/soba-web-activation-sanitized/provenance.json
          if-no-files-found: error
          retention-days: 14

  browser:
    # Real Go management HTTP and embedded assets; networking peers are fixtures.
    needs: impact
    if: always() && !cancelled() && github.event.repository.private == false && needs.impact.outputs.scope != 'docs' && needs.impact.outputs.scope != 'go'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
          check-latest: false
      - name: Test and reproduce locked frontend assets
        run: |
          set -euo pipefail
          npm install --global npm@11.9.0 --no-audit --no-fund
          python .github/scripts/check-frontend.py
          git diff --exit-code -- web/dist
      - name: Install official Chromium and fonts
        run: |
          set -euo pipefail
          node web/node_modules/@playwright/test/cli.js install --with-deps chromium
          sudo apt-get install --yes --no-install-recommends fonts-noto-cjk
      - name: Verify actual UI workflows with isolated Playwright fixtures
        timeout-minutes: 15
        run: |
          set -euo pipefail
          go run ./cmd/prepare-engine
          go run ./cmd/prepare-engine --verify
          go mod verify
          go build -tags=soba_e2e,ts_omit_portmapper,ts_omit_captiveportal,ts_omit_useproxy -o "$RUNNER_TEMP/soba-e2e" ./cmd/soba-e2e
          npm --prefix web run test:browser:safety
          screenshots="$RUNNER_TEMP/soba-playwright-screenshots"
          mkdir -m 700 "$screenshots"
          SOBA_E2E_BINARY="$RUNNER_TEMP/soba-e2e" SOBA_SCREENSHOT_DIR="$screenshots" npm --prefix web run test:browser
      - name: Preserve sanitized UI screenshots and typography measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: soba-browser-screenshots
          path: |
            ${{ runner.temp }}/soba-playwright-screenshots/*.png
            ${{ runner.temp }}/soba-playwright-screenshots/typography-*.json
            ${{ runner.temp }}/soba-playwright-screenshots/playwright-report.json
          if-no-files-found: warn
          retention-days: 14

  go-unit:
    needs: impact
    if: needs.impact.outputs.scope == 'go'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ci-impact-plan
          path: ${{ runner.temp }}/ci-plan
      - name: Validate scoped Go selection
        run: |
          python .github/scripts/ci-coverage.py resolve --input "$RUNNER_TEMP/ci-plan/ci-impact-plan.json" --output "$RUNNER_TEMP/ci-go-plan.json"
          python -c 'import json,os; assert json.load(open(os.environ["RUNNER_TEMP"]+"/ci-go-plan.json"))["scope"] == "go"'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Locate scoped Go caches
        id: scoped-cache-info
        run: |
          echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      # Scoped checks never populate trusted-main or release cache namespaces.
      - name: Restore scoped Go caches
        id: scoped-go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ steps.scoped-cache-info.outputs.gomodcache }}
            ${{ steps.scoped-cache-info.outputs.gocache }}
          key: scoped-go-v1-${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-go1.27.1-${{ hashFiles('go.mod', 'go.sum', 'internal/engineadaptation/**', 'internal/lifecycleadaptation/**', 'cmd/prepare-engine/**') }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: scoped-go-v1-${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-go1.27.1-${{ hashFiles('go.mod', 'go.sum', 'internal/engineadaptation/**', 'internal/lifecycleadaptation/**', 'cmd/prepare-engine/**') }}-${{ github.ref }}-
      - name: Check exact toolchain and module graph
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = go1.27.1
          test "$(go env GOOS)/$(go env GOARCH)" = linux/amd64
          go run ./cmd/prepare-engine
          go run ./cmd/prepare-engine --verify
          go mod verify
      - name: Test affected Go packages and reverse dependencies
        run: |
          set -euo pipefail
          python .github/scripts/ci-go-scope.py --plan "$RUNNER_TEMP/ci-go-plan.json"
          unformatted="$(gofmt -l cmd internal web)"
          test -z "$unformatted" || { printf 'Go files need gofmt:\n%s\n' "$unformatted" >&2; exit 1; }
      - name: Save scoped Go caches after checks pass
        if: success() && steps.scoped-go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ steps.scoped-cache-info.outputs.gomodcache }}
            ${{ steps.scoped-cache-info.outputs.gocache }}
          key: ${{ steps.scoped-go-cache.outputs.cache-primary-key }}

  ci-required:
    # Require this aggregate in branch protection; a skipped job alone is green.
    needs: [impact, native, browser, go-unit, manifest-smoke]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download selection evidence
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ci-impact-plan
          path: ${{ runner.temp }}/ci-plan
      - name: Require every check selected for this change
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/ci-coverage.py finalize --input "$RUNNER_TEMP/ci-plan/ci-impact-plan.json" --output ci-coverage.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-coverage
          path: ci-coverage.json
          if-no-files-found: error
          retention-days: 90
