<text x="760" y="488" font-size="13" fill="#5844bf" font-weight="650" text-anchor="middle" id="label-33-box-20">3</text>
<text x="480.0" y="515" font-size="13" fill="#5844bf" font-weight="600" text-anchor="middle" id="label-34-box-912">Alternative: full fingerprint verification</text>
<text x="480.0" y="539" font-size="12" fill="#596172" font-weight="400" text-anchor="middle" id="label-35-box-912">Both compare independently, then both approve</text>
<rect x="24" y="563" width="912" height="77" rx="12" fill="#f0edff"/>
<text x="40" y="589" font-size="14" fill="#5844bf" font-weight="400" text-anchor="start" id="label-37-box-900">TOFU remembers the accepted key.</text>
<text x="40" y="611" font-size="14" fill="#5844bf" font-weight="400" text-anchor="start" id="label-38-box-900">It cannot prevent first-use impersonation.</text>
<path d="M24 656H936" fill="none" stroke="#e0e2ea" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="24" y="676" font-size="13" fill="#596172" font-weight="400" text-anchor="start" id="label-40-box-916">Pair saved? Check connectivity and app permission.</text>
<text x="24" y="696" font-size="13" fill="#596172" font-weight="400" text-anchor="start" id="label-41-box-916">Unknown result? Inspect the original session.</text>
<text x="24" y="716" font-size="13" fill="#596172" font-weight="400" text-anchor="start" id="label-42-box-916">Discovery stops at 120s. The earlier peer review deadline wins.</text>
</svg>