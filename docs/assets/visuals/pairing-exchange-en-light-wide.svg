<text x="480.0" y="465" font-size="17" fill="#272c38" font-weight="600" text-anchor="middle" id="label-29-box-540">Review that request → approve</text>
<path d="M760 483 L200 483" fill="none" stroke="#6550d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
