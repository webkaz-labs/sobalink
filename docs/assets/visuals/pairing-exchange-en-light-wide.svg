<text x="200" y="325" font-size="13" fill="#5844bf" font-weight="650" text-anchor="middle" id="label-21-box-20">1</text>
<path d="M215 320h12v13h-12" fill="none" stroke="#6550d8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="480.0" y="342" font-size="14" fill="#596172" font-weight="400" text-anchor="middle" id="label-23-box-545">Name / IP is not identity proof</text>
<text x="480.0" y="390" font-size="17" fill="#272c38" font-weight="600" text-anchor="middle" id="label-24-box-540">Review key, scope, expiry → request</text>
