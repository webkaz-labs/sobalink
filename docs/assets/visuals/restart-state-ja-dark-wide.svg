<svg xmlns="http://www.w3.org/2000/svg" width="960" height="730" viewBox="0 0 960 730" role="img" aria-labelledby="title desc" xml:lang="ja">
<title id="title">再起動で、何が戻る？</title><desc id="desc">通常起動とoffline起動の差。通常の保存済みサービスは停止したまま。承認済み起動選択だけが別条件で試行し、永続キューは元のIDと期限を維持します。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Noto Sans CJK JP","Noto Sans JP",sans-serif}</style>
<rect x="0" y="0" width="960" height="730" rx="0" fill="#1d202a"/>
<text x="24" y="33" font-size="13" fill="#c0aeff" font-weight="600" text-anchor="start" id="label-4-box-916">sobalink  /  図解</text>
<text x="24" y="73" font-size="28" fill="#e8e9f0" font-weight="650" text-anchor="start" id="label-5-box-916">再起動で、何が戻る？</text>
<text x="24" y="105" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-6-box-916">同じプロファイル · 停止してから、起動方法を選択</text>
<rect x="388.0" y="130" width="184" height="30" rx="15" fill="#30294b"/>
<text x="480.0" y="151" font-size="13" fill="#c0aeff" font-weight="600" text-anchor="middle" id="label-8-box-168">停止 → プロセス再起動</text>
<path d="M480.0 164v14H540v17 M480.0 178H800v17" fill="none" stroke="#9ba4b7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="540" y="211" font-size="13" fill="#c0aeff" font-weight="650" text-anchor="middle" id="label-10-box-100">通常起動</text>
<text x="800" y="211" font-size="13" fill="#c0aeff" font-weight="650" text-anchor="middle" id="label-11-box-100">管理のみ</text>
<text x="540" y="232" font-size="12" fill="#bdc5d8" font-weight="400" text-anchor="middle" id="label-12-box-100">saved</text>
<text x="800" y="232" font-size="12" fill="#bdc5d8" font-weight="400" text-anchor="middle" id="label-13-box-100">offline</text>
<text x="24" y="219" font-size="15" fill="#bdc5d8" font-weight="600" text-anchor="start" id="label-14-box-916">対象</text>
<rect x="16" y="240" width="928" height="49" rx="0" fill="#191c24"/>
<text x="24" y="273" font-size="16" fill="#e8e9f0" font-weight="400" text-anchor="start" id="label-16-box-390">管理UI / CLI</text>
<text x="540" y="273" font-size="16" fill="#c0aeff" font-weight="400" text-anchor="middle" id="label-17-box-220">起動</text>
<text x="800" y="273" font-size="16" fill="#bdc5d8" font-weight="400" text-anchor="middle" id="label-18-box-220">起動</text>
<text x="24" y="322" font-size="16" fill="#e8e9f0" font-weight="400" text-anchor="start" id="label-19-box-390">保存したネットワーク</text>
<text x="540" y="322" font-size="16" fill="#c0aeff" font-weight="400" text-anchor="middle" id="label-20-box-220">起動試行</text>
<text x="800" y="322" font-size="16" fill="#bdc5d8" font-weight="400" text-anchor="middle" id="label-21-box-220">起動せず</text>
<rect x="16" y="338" width="928" height="49" rx="0" fill="#191c24"/>
<text x="24" y="371" font-size="16" fill="#e8e9f0" font-weight="400" text-anchor="start" id="label-23-box-390">受信・自動保存の許可</text>
<text x="540" y="371" font-size="16" fill="#bdc5d8" font-weight="400" text-anchor="middle" id="label-24-box-220">条件付き</text>
<text x="800" y="371" font-size="16" fill="#bdc5d8" font-weight="400" text-anchor="middle" id="label-25-box-220">保存のみ</text>
<text x="24" y="420" font-size="16" fill="#e8e9f0" font-weight="400" text-anchor="start" id="label-26-box-390">通常の保存サービス</text>
<text x="540" y="420" font-size="16" fill="#bdc5d8" font-weight="400" text-anchor="middle" id="label-27-box-220">停止</text>
<text x="800" y="420" font-size="16" fill="#bdc5d8" font-weight="400" text-anchor="middle" id="label-28-box-220">停止</text>
<rect x="16" y="436" width="928" height="49" rx="0" fill="#191c24"/>
<text x="24" y="469" font-size="16" fill="#e8e9f0" font-weight="400" text-anchor="start" id="label-30-box-390">承認済み起動選択</text>
<text x="540" y="469" font-size="16" fill="#c0aeff" font-weight="400" text-anchor="middle" id="label-31-box-220">条件付き1回</text>
<text x="800" y="469" font-size="16" fill="#bdc5d8" font-weight="400" text-anchor="middle" id="label-32-box-220">抑止</text>
<text x="24" y="518" font-size="16" fill="#e8e9f0" font-weight="400" text-anchor="start" id="label-33-box-390">永続文字・ファイル</text>
<text x="540" y="518" font-size="16" fill="#bdc5d8" font-weight="400" text-anchor="middle" id="label-34-box-220">条件付き</text>
<text x="800" y="518" font-size="16" fill="#bdc5d8" font-weight="400" text-anchor="middle" id="label-35-box-220">配達せず</text>
<rect x="16" y="534" width="928" height="49" rx="0" fill="#191c24"/>
<text x="24" y="567" font-size="16" fill="#e8e9f0" font-weight="400" text-anchor="start" id="label-37-box-390">即時転送の途中状態</text>
<text x="540" y="567" font-size="16" fill="#bdc5d8" font-weight="400" text-anchor="middle" id="label-38-box-220">再開せず</text>
<text x="800" y="567" font-size="16" fill="#bdc5d8" font-weight="400" text-anchor="middle" id="label-39-box-220">再開せず</text>
<path d="M24 604H936" fill="none" stroke="#454959" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="24" y="624" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-41-box-916">条件付き: 現在の接続・権限・停止設定を確認。</text>
<text x="24" y="644" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-42-box-916">永続キューは元のID・期限内で試行。</text>
<text x="24" y="664" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-43-box-916">offline は保存済みの許可を消しません。</text>
<text x="24" y="684" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-44-box-916">soba status で接続状態を別に確認。</text>
</svg>