<text x="800" y="518" font-size="16" fill="#596172" font-weight="400" text-anchor="middle" id="label-35-box-220">No delivery</text>
<rect x="16" y="534" width="928" height="49" rx="0" fill="#f8f8fb"/>
<text x="24" y="567" font-size="16" fill="#272c38" font-weight="400" text-anchor="start" id="label-37-box-390">Immediate transfer</text>
<text x="540" y="567" font-size="16" fill="#596172" font-weight="400" text-anchor="middle" id="label-38-box-220">No resume</text>
<text x="800" y="567" font-size="16" fill="#596172" font-weight="400" text-anchor="middle" id="label-39-box-220">No resume</text>
<path d="M24 604H936" fill="none" stroke="#e0e2ea" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="24" y="624" font-size="13" fill="#596172" font-weight="400" text-anchor="start" id="label-41-box-916">Conditional: current connection, permission and pause.</text>
<text x="24" y="644" font-size="13" fill="#596172" font-weight="400" text-anchor="start" id="label-42-box-916">Durable attempts keep the original ID and deadline.</text>
<text x="24" y="664" font-size="13" fill="#596172" font-weight="400" text-anchor="start" id="label-43-box-916">Offline does not erase saved approvals.</text>
<text x="24" y="684" font-size="13" fill="#596172" font-weight="400" text-anchor="start" id="label-44-box-916">Check connectivity separately with soba status.</text>
