<svg xmlns="http://www.w3.org/2000/svg" width="400" height="800" viewBox="0 0 400 800" role="img" aria-labelledby="title desc" xml:lang="ja">
<title id="title">設定を保存。開始は、別の操作。</title><desc id="desc">保存は停止した定義を作ります。別途内容を確認して開始すると実行状態になり、停止は設定を保って稼働だけを止めます。通常の保存定義はプロセス再起動しても停止したままです。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Noto Sans CJK JP","Noto Sans JP",sans-serif}</style>
<rect x="0" y="0" width="400" height="800" rx="0" fill="#1d202a"/>
<text x="24" y="33" font-size="13" fill="#c0aeff" font-weight="600" text-anchor="start" id="label-4-box-356">sobalink  /  図解</text>
<text x="24" y="73" font-size="22" fill="#e8e9f0" font-weight="650" text-anchor="start" id="label-5-box-356">設定を保存。開始は、別の操作。</text>
<text x="24" y="105" font-size="14" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-6-box-356">通常の保存サービスを手動で開始する場合</text>
<rect x="24" y="138" width="352" height="102" rx="12" fill="#191c24" stroke="#454959"/>
<rect x="42" y="158" width="36" height="50" rx="4" fill="#30294b" stroke="#454959"/>
<path d="M50 172h20 M50 181h20 M50 190h14" fill="none" stroke="#a18bff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="94" y="170" font-size="19" fill="#e8e9f0" font-weight="650" text-anchor="start" id="label-10-box-286">保存済みの定義</text>
<text x="94" y="196" font-size="12" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-11-box-280">相手・ポート・期限などの設定</text>
<text x="94" y="218" font-size="12" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-12-box-280">保存だけでは待受や許可を開始しない</text>
<path d="M200.0 247V278" fill="none" stroke="#9ba4b7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/>
<rect x="110" y="290" width="180" height="60" rx="30" fill="#191c24" stroke="#454959"/>
<text x="200" y="327" font-size="20" fill="#c0aeff" font-weight="650" text-anchor="middle" id="label-15-box-160">停止中</text>
<rect x="110" y="484" width="180" height="60" rx="30" fill="#30294b" stroke="#454959"/>
<text x="200" y="521" font-size="20" fill="#c0aeff" font-weight="650" text-anchor="middle" id="label-17-box-160">実行中</text>
<path d="M200 358 L200 476" fill="none" stroke="#a18bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M196.2 469.0 L200 476 L203.8 469.0" fill="none" stroke="#a18bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="398" width="320" height="43" rx="0" fill="#1d202a"/>
<text x="200" y="415" font-size="13" fill="#c0aeff" font-weight="600" text-anchor="middle" id="label-21-box-320">内容を確認して、明示的に開始</text>
<text x="200" y="436" font-size="12" fill="#bdc5d8" font-weight="400" text-anchor="middle" id="label-22-box-320">ネットワーク・相手の識別情報を再確認</text>
<path d="M295 525H368V314H297" fill="none" stroke="#9ba4b7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M313 314 L297 314" fill="none" stroke="#9ba4b7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M304.0 310.2 L297 314 L304.0 317.8" fill="none" stroke="#9ba4b7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="352" y="474" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="middle" id="label-26-box-50">停止</text>
<rect x="54.0" y="607" width="292" height="30" rx="15" fill="#30294b"/>
<text x="200.0" y="628" font-size="13" fill="#c0aeff" font-weight="600" text-anchor="middle" id="label-28-box-276">実アプリの接続・認証は別に確認</text>
<path d="M24 668H376" fill="none" stroke="#454959" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="24" y="688" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-30-box-356">通常の定義は、プロセス再起動後も停止したまま。</text>
<text x="24" y="708" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-31-box-356">自動の起動選択は、別途確認・承認する設定です。</text>
<text x="24" y="728" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-32-box-356">停止で終了するのは稼働と許可。定義は残ります。</text>
</svg>