<text x="200.0" y="302" font-size="14" fill="#272c38" font-weight="600" text-anchor="middle" id="label-19-box-268">Requester selects a candidate</text>
<circle cx="56" cy="320" r="12" fill="#f0edff"/>
<text x="56" y="325" font-size="13" fill="#5844bf" font-weight="650" text-anchor="middle" id="label-21-box-20">1</text>
<path d="M71 320h12v13h-12" fill="none" stroke="#6550d8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="200.0" y="342" font-size="12" fill="#596172" font-weight="400" text-anchor="middle" id="label-23-box-273">Name / IP is not identity proof</text>
<text x="200.0" y="390" font-size="14" fill="#272c38" font-weight="600" text-anchor="middle" id="label-24-box-268">Review key, scope, expiry → request</text>
<path d="M56 408 L344 408" fill="none" stroke="#6550d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M337.0 411.8 L344 408 L337.0 404.2" fill="none" stroke="#6550d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="56" cy="408" r="12" fill="#f0edff"/>
<text x="56" y="413" font-size="13" fill="#5844bf" font-weight="650" text-anchor="middle" id="label-28-box-20">2</text>
<text x="200.0" y="465" font-size="14" fill="#272c38" font-weight="600" text-anchor="middle" id="label-29-box-268">Review that request → approve</text>
<path d="M344 483 L56 483" fill="none" stroke="#6550d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M63.0 479.2 L56 483 L63.0 486.8" fill="none" stroke="#6550d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="344" cy="483" r="12" fill="#f0edff"/>
<text x="344" y="488" font-size="13" fill="#5844bf" font-weight="650" text-anchor="middle" id="label-33-box-20">3</text>
<text x="200.0" y="515" font-size="13" fill="#5844bf" font-weight="600" text-anchor="middle" id="label-34-box-352">Alternative: full fingerprint verification</text>
<text x="200.0" y="539" font-size="12" fill="#596172" font-weight="400" text-anchor="middle" id="label-35-box-352">Both compare independently, then both approve</text>
<rect x="24" y="563" width="352" height="77" rx="12" fill="#f0edff"/>
<text x="40" y="589" font-size="14" fill="#5844bf" font-weight="400" text-anchor="start" id="label-37-box-340">TOFU remembers the accepted key.</text>
<text x="40" y="611" font-size="14" fill="#5844bf" font-weight="400" text-anchor="start" id="label-38-box-340">It cannot prevent first-use impersonation.</text>
<path d="M24 656H376" fill="none" stroke="#e0e2ea" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="24" y="676" font-size="13" fill="#596172" font-weight="400" text-anchor="start" id="label-40-box-356">Pair saved? Check connectivity and app permission.</text>
<text x="24" y="696" font-size="13" fill="#596172" font-weight="400" text-anchor="start" id="label-41-box-356">Unknown result? Inspect the original session.</text>
<text x="24" y="716" font-size="13" fill="#596172" font-weight="400" text-anchor="start" id="label-42-box-356">Discovery stops at 120s; request expiry differs.</text>
<text x="24" y="736" font-size="13" fill="#596172" font-weight="400" text-anchor="start" id="label-43-box-356">The earlier peer deadline wins.</text>
</svg>