<svg xmlns="http://www.w3.org/2000/svg" width="400" height="790" viewBox="0 0 400 790" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Request here. Approve there.</title><desc id="desc">In the TOFU flow the receiver opens a scoped request session. Full fingerprint verification additionally requires independent comparison and explicit approval on both devices. The requester reviews the exact key and deadline, then sends. The receiver approves that request. Discovery is not identity proof; TOFU does not prevent first-use impersonation. Saved pairing, connectivity and application permissions remain separate.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Noto Sans CJK JP","Noto Sans JP",sans-serif}</style>
