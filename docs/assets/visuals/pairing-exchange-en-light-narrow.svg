<text x="344.0" y="221" font-size="15" fill="#272c38" font-weight="600" text-anchor="middle" id="label-14-box-119">Receiver</text>
<path d="M56 234V580" fill="none" stroke="#e0e2ea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6"/>
<path d="M344 234V580" fill="none" stroke="#e0e2ea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6"/>
<rect x="200" y="231" width="180" height="30" rx="15" fill="#f0edff"/>
