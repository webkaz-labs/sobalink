<text x="330" y="497" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="middle" id="label-32-box-100">抑止</text>
<text x="24" y="553" font-size="14" fill="#e8e9f0" font-weight="400" text-anchor="start" id="label-33-box-165">永続キュー</text>
<text x="226" y="553" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="middle" id="label-34-box-100">条件付き</text>
<text x="330" y="553" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="middle" id="label-35-box-100">配達せず</text>
<rect x="16" y="576" width="368" height="56" rx="0" fill="#191c24"/>
<text x="24" y="609" font-size="14" fill="#e8e9f0" font-weight="400" text-anchor="start" id="label-37-box-165">即時転送の途中</text>
<text x="226" y="609" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="middle" id="label-38-box-100">再開せず</text>
<text x="330" y="609" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="middle" id="label-39-box-100">再開せず</text>
<path d="M24 652H376" fill="none" stroke="#454959" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="24" y="672" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-41-box-356">条件付き: 現在の接続・権限・停止設定を確認。</text>
<text x="24" y="692" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-42-box-356">永続キューは元のID・期限内で試行。</text>
<text x="24" y="712" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-43-box-356">offline は保存済みの許可を消しません。</text>
<text x="24" y="732" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-44-box-356">soba status で接続状態を別に確認。</text>
