<svg xmlns="http://www.w3.org/2000/svg" width="400" height="800" viewBox="0 0 400 800" role="img" aria-labelledby="title desc" xml:lang="ja">
<title id="title">再起動で、何が戻る？</title><desc id="desc">通常起動とoffline起動の差。通常の保存済みサービスは停止したまま。承認済み起動選択だけが別条件で試行し、永続キューは元のIDと期限を維持します。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Noto Sans CJK JP","Noto Sans JP",sans-serif}</style>
<rect x="0" y="0" width="400" height="800" rx="0" fill="#1d202a"/>
<text x="24" y="33" font-size="13" fill="#c0aeff" font-weight="600" text-anchor="start" id="label-4-box-356">sobalink  /  図解</text>
<text x="24" y="73" font-size="22" fill="#e8e9f0" font-weight="650" text-anchor="start" id="label-5-box-356">再起動で、何が戻る？</text>
<text x="24" y="105" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-6-box-356">同じプロファイル · 停止してから、起動方法を選択</text>
<rect x="108.0" y="130" width="184" height="30" rx="15" fill="#30294b"/>
<text x="200.0" y="151" font-size="13" fill="#c0aeff" font-weight="600" text-anchor="middle" id="label-8-box-168">停止 → プロセス再起動</text>
