<text x="330" y="211" font-size="13" fill="#c0aeff" font-weight="650" text-anchor="middle" id="label-11-box-100">管理のみ</text>
<text x="226" y="232" font-size="12" fill="#bdc5d8" font-weight="400" text-anchor="middle" id="label-12-box-100">saved</text>
<text x="330" y="232" font-size="12" fill="#bdc5d8" font-weight="400" text-anchor="middle" id="label-13-box-100">offline</text>
<text x="24" y="219" font-size="15" fill="#bdc5d8" font-weight="600" text-anchor="start" id="label-14-box-356">対象</text>
<rect x="16" y="240" width="368" height="56" rx="0" fill="#191c24"/>
<text x="24" y="273" font-size="14" fill="#e8e9f0" font-weight="400" text-anchor="start" id="label-16-box-165">管理UI / CLI</text>
<text x="226" y="273" font-size="13" fill="#c0aeff" font-weight="400" text-anchor="middle" id="label-17-box-100">起動</text>
<text x="330" y="273" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="middle" id="label-18-box-100">起動</text>
<text x="24" y="329" font-size="14" fill="#e8e9f0" font-weight="400" text-anchor="start" id="label-19-box-165">ネットワーク</text>
<text x="226" y="329" font-size="13" fill="#c0aeff" font-weight="400" text-anchor="middle" id="label-20-box-100">起動試行</text>
<text x="330" y="329" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="middle" id="label-21-box-100">起動せず</text>
<rect x="16" y="352" width="368" height="56" rx="0" fill="#191c24"/>
<text x="24" y="385" font-size="14" fill="#e8e9f0" font-weight="400" text-anchor="start" id="label-23-box-165">受信 / 自動保存</text>
<text x="226" y="385" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="middle" id="label-24-box-100">条件付き</text>
<text x="330" y="385" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="middle" id="label-25-box-100">保存のみ</text>
<text x="24" y="441" font-size="14" fill="#e8e9f0" font-weight="400" text-anchor="start" id="label-26-box-165">通常の保存定義</text>
<text x="226" y="441" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="middle" id="label-27-box-100">停止</text>
<text x="330" y="441" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="middle" id="label-28-box-100">停止</text>
