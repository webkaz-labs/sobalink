<svg xmlns="http://www.w3.org/2000/svg" width="400" height="850" viewBox="0 0 400 850" role="img" aria-labelledby="title desc" xml:lang="ja">
<title id="title">空きポートは、予約ではない。</title><desc id="desc">停止中の定義に対する一時bindの観測。全ソケットを閉じて候補を返し、別の保存や起動で再確認します。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Noto Sans CJK JP","Noto Sans JP",sans-serif}</style>
<rect x="0" y="0" width="400" height="850" rx="0" fill="#1d202a"/>
<text x="24" y="33" font-size="13" fill="#c0aeff" font-weight="600" text-anchor="start" id="label-4-box-356">sobalink  /  図解</text>
<text x="24" y="73" font-size="22" fill="#e8e9f0" font-weight="650" text-anchor="start" id="label-5-box-356">空きポートは、予約ではない。</text>
<text x="24" y="105" font-size="14" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-6-box-356">停止中の接続 · 元のリビジョンを維持</text>
<rect x="24" y="132" width="352" height="104" rx="12" fill="#191c24" stroke="#454959"/>
<text x="40" y="160" font-size="18" fill="#e8e9f0" font-weight="600" text-anchor="start" id="label-8-box-340">1  一時的にポートを開いて確認</text>
<text x="40" y="187" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-9-box-340">元のポート → 使用中の場合だけ候補を調べる</text>
<text x="40" y="209" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-10-box-340">TCP/UDP・loopback・リモート範囲は固定</text>
<path d="M48 278H352" fill="none" stroke="#9ba4b7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="48" cy="278" r="5" fill="#a18bff"/>
<circle cx="352" cy="278" r="5" fill="#a18bff"/>
<text x="48" y="264" font-size="13" fill="#c0aeff" font-weight="400" text-anchor="start" id="label-14-box-332">開く</text>
<text x="352" y="264" font-size="13" fill="#c0aeff" font-weight="400" text-anchor="end" id="label-15-box-76">全て閉じる</text>
<rect x="100.0" y="293" width="200" height="30" rx="15" fill="#30294b"/>
<text x="200.0" y="314" font-size="13" fill="#c0aeff" font-weight="600" text-anchor="middle" id="label-17-box-184">候補 = 今この瞬間の観測</text>
<path d="M40 333 L40 366" fill="none" stroke="#9ba4b7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
<path d="M36.2 359.0 L40 366 L43.8 359.0" fill="none" stroke="#9ba4b7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="200.0" y="354" font-size="12" fill="#bdc5d8" font-weight="400" text-anchor="middle" id="label-20-box-380">閉じた後は、他のアプリが取得する場合も</text>
<text x="24" y="388" font-size="16" fill="#e8e9f0" font-weight="600" text-anchor="start" id="label-21-box-356">2  対応を確認して、別途保存／起動</text>
<text x="90" y="426" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="middle" id="label-22-box-160">ローカル</text>
<text x="305" y="426" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="middle" id="label-23-box-170">リモート</text>
<rect x="44" y="438" width="92" height="30" rx="15" fill="#30294b"/>
<text x="90.0" y="459" font-size="13" fill="#c0aeff" font-weight="600" text-anchor="middle" id="label-25-box-76">49152</text>
<rect x="259" y="438" width="92" height="30" rx="15" fill="#30294b"/>
<text x="305.0" y="459" font-size="13" fill="#c0aeff" font-weight="600" text-anchor="middle" id="label-27-box-76">8000</text>
<path d="M144 453 L251 453" fill="none" stroke="#a18bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M244.0 456.8 L251 453 L244.0 449.2" fill="none" stroke="#a18bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="44" y="480" width="92" height="30" rx="15" fill="#30294b"/>
<text x="90.0" y="501" font-size="13" fill="#c0aeff" font-weight="600" text-anchor="middle" id="label-31-box-76">49153</text>
<rect x="259" y="480" width="92" height="30" rx="15" fill="#30294b"/>
<text x="305.0" y="501" font-size="13" fill="#c0aeff" font-weight="600" text-anchor="middle" id="label-33-box-76">8002</text>
<path d="M144 495 L251 495" fill="none" stroke="#a18bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M244.0 498.8 L251 495 L244.0 491.2" fill="none" stroke="#a18bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="305" y="546" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="middle" id="label-36-box-170">8001 は除外</text>
<text x="24" y="577" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-37-box-356">元の設定が変わったら、候補を再確認。</text>
<rect x="24" y="600" width="352" height="72" rx="10" fill="#30294b"/>
<text x="40" y="624" font-size="17" fill="#c0aeff" font-weight="600" text-anchor="start" id="label-39-box-340">3  実際の起動で、もう一度開く</text>
<text x="40" y="649" font-size="12" fill="#c0aeff" font-weight="400" text-anchor="start" id="label-40-box-340">保存時はリビジョン確認。起動時に全ポートを再確認。</text>
<path d="M24 752H376" fill="none" stroke="#454959" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="24" y="772" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-42-box-356">候補選択だけでは保存・共有・起動しません。</text>
<text x="24" y="792" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-43-box-356">起動時に競合したら停止。別ポートへ勝手に変更しません。</text>
</svg>