<svg xmlns="http://www.w3.org/2000/svg" width="400" height="850" viewBox="0 0 400 850" role="img" aria-labelledby="title desc" xml:lang="ja">
<title id="title">つながることと、許可すること。</title><desc id="desc">接続、文字とファイル申込みへの信頼、ファイル保存同意、自動保存、サービスの相手・port・期限は独立した許可です。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Noto Sans CJK JP","Noto Sans JP",sans-serif}</style>
<rect x="0" y="0" width="400" height="850" rx="0" fill="#1d202a"/>
<text x="24" y="33" font-size="13" fill="#c0aeff" font-weight="600" text-anchor="start" id="label-4-box-356">sobalink  /  図解</text>
<text x="24" y="73" font-size="22" fill="#e8e9f0" font-weight="650" text-anchor="start" id="label-5-box-356">つながることと、許可すること。</text>
<text x="24" y="105" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-6-box-356">接続できても、受信や共有は別に選びます。</text>
<rect x="24" y="136" width="205" height="30" rx="15" fill="#30294b"/>
<text x="126.5" y="157" font-size="13" fill="#c0aeff" font-weight="600" text-anchor="middle" id="label-8-box-189">接続済みの経路</text>
<path d="M40 171V551" fill="none" stroke="#454959" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M40 232H56" fill="none" stroke="#454959" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="56" y="207" width="320" height="278" rx="12" fill="#191c24" stroke="#454959"/>
<text x="72" y="237" font-size="17" fill="#e8e9f0" font-weight="650" text-anchor="start" id="label-12-box-288">A  文字・ファイルを受信</text>
<rect x="72" y="257" width="288" height="30" rx="15" fill="#30294b"/>
<text x="216.0" y="278" font-size="13" fill="#c0aeff" font-weight="600" text-anchor="middle" id="label-14-box-272">この送信元を信頼</text>
<path d="M216.0 294v15H133v17 M216.0 309H294v17" fill="none" stroke="#a18bff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="133" y="347" font-size="14" fill="#c0aeff" font-weight="400" text-anchor="middle" id="label-16-box-140">文字を受信</text>
<text x="294" y="347" font-size="14" fill="#c0aeff" font-weight="400" text-anchor="middle" id="label-17-box-140">ファイル申込み</text>
<path d="M294 359 L294 382" fill="none" stroke="#a18bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M290.2 375.0 L294 382 L297.8 375.0" fill="none" stroke="#a18bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="294" y="407" font-size="14" fill="#e8e9f0" font-weight="600" text-anchor="middle" id="label-20-box-160">保存の同意</text>
<text x="72" y="440" font-size="12" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-21-box-288">通常: バッチごとに受信承認</text>
<text x="72" y="462" font-size="12" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-22-box-288">自動保存: 相手と保存先を別途承認</text>
<path d="M40 551H56" fill="none" stroke="#454959" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="56" y="526" width="320" height="194" rx="12" fill="#191c24" stroke="#454959"/>
<text x="72" y="556" font-size="17" fill="#e8e9f0" font-weight="650" text-anchor="start" id="label-25-box-288">B  サービス共有</text>
<rect x="72" y="576" width="288" height="30" rx="15" fill="#30294b"/>
<text x="216.0" y="597" font-size="13" fill="#c0aeff" font-weight="600" text-anchor="middle" id="label-27-box-272">相手・ポート・期限を許可</text>
<path d="M216.0 615 L216.0 641" fill="none" stroke="#a18bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M212.2 634.0 L216.0 641 L219.8 634.0" fill="none" stroke="#a18bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="216.0" y="669" font-size="14" fill="#c0aeff" font-weight="600" text-anchor="middle" id="label-30-box-290">指定したサービスだけを公開</text>
<text x="216.0" y="697" font-size="12" fill="#bdc5d8" font-weight="400" text-anchor="middle" id="label-31-box-290">アプリの起動・認証も別途必要</text>
<path d="M24 758H376" fill="none" stroke="#454959" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="24" y="778" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-33-box-356">A と B は独立。片方の承認では他方は有効になりません。</text>
<text x="24" y="798" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-34-box-356">受信側が、その端末への許可を決めます。</text>
<text x="24" y="818" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-35-box-356">逆方向は、もう一方の端末で別に許可します。</text>
</svg>