<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 872" width="360" height="872" role="img" aria-labelledby="title desc" xml:lang="ja"><title id="title">つながることと、許可すること。</title><desc id="desc">接続の準備、メッセージとファイルの送信元に対する信頼、サービスの共有許可は別の判断です。ネットワークへの参加だけでは信頼やサービス共有は許可されません。ファイル保存は通常バッチごとの受信同意が必要です。自動保存は別途明示的に設定します。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Noto Sans CJK JP","Noto Sans JP",sans-serif}</style>
<rect x="0" y="0" width="360" height="872" rx="0" fill="#1d202a"/>
<g transform="translate(24 25) rotate(-23 12 12)" fill="#a18bff" aria-hidden="true"><rect width="6" height="24" rx="3"/><rect x="9" y="5" width="6" height="16" rx="3"/><rect x="18" y="2" width="6" height="22" rx="3" opacity=".6"/></g>
<text x="60" y="45" font-size="22" fill="#e8e9f0" font-weight="650">sobalink</text>
<text x="24" y="100" font-size="22" fill="#e8e9f0" font-weight="650">つながることと、</text>
<text x="24" y="133" font-size="22" fill="#e8e9f0" font-weight="650">許可すること。</text>
<text x="24" y="168" font-size="14" fill="#bdc5d8" font-weight="400">接続・受信・共有は、個別に確認。</text>
<rect x="16" y="192" width="328" height="162" rx="16" fill="#191c24"/>
<text x="32" y="219" font-size="13" fill="#c0aeff" font-weight="600">接続</text>
<text x="32" y="250" font-size="20" fill="#e8e9f0" font-weight="650">ネットワークへ参加</text>
<text x="32" y="278" font-size="15" fill="#bdc5d8" font-weight="400">選んだ経路で</text>
<text x="32" y="300" font-size="15" fill="#bdc5d8" font-weight="400">相手と通信する準備</text>
<text x="32" y="332" font-size="13" fill="#c0aeff" font-weight="500">信頼・共有の許可とは別</text>
<rect x="16" y="377" width="328" height="162" rx="16" fill="#191c24"/>
<text x="32" y="404" font-size="13" fill="#c0aeff" font-weight="600">受信</text>
<text x="32" y="435" font-size="20" fill="#e8e9f0" font-weight="650">相手を信頼</text>
<text x="32" y="463" font-size="15" fill="#bdc5d8" font-weight="400">メッセージの受信と</text>
<text x="32" y="485" font-size="15" fill="#bdc5d8" font-weight="400">ファイルの申込みを許可</text>
<text x="32" y="517" font-size="13" fill="#c0aeff" font-weight="500">通常はファイルをバッチごとに承認</text>
<rect x="16" y="562" width="328" height="162" rx="16" fill="#191c24"/>
<text x="32" y="589" font-size="13" fill="#c0aeff" font-weight="600">共有</text>
<text x="32" y="620" font-size="20" fill="#e8e9f0" font-weight="650">サービスを許可</text>
<text x="32" y="648" font-size="15" fill="#bdc5d8" font-weight="400">相手・ポート・期限を</text>
<text x="32" y="670" font-size="15" fill="#bdc5d8" font-weight="400">指定して共有</text>
<text x="32" y="702" font-size="13" fill="#c0aeff" font-weight="500">メッセージ・ファイルの信頼とは別</text>
<text x="24" y="772" font-size="13" fill="#bdc5d8" font-weight="400">受信の許可は、受け取る側が決めます。</text>
<text x="24" y="797" font-size="13" fill="#bdc5d8" font-weight="400">自動保存は、相手と保存先を選んで</text>
<text x="24" y="822" font-size="13" fill="#bdc5d8" font-weight="400">別途有効にします。</text>
</svg>