<svg xmlns="http://www.w3.org/2000/svg" width="960" height="690" viewBox="0 0 960 690" role="img" aria-labelledby="title desc" xml:lang="ja">
<title id="title">文字とファイル、保存までの違い。</title><desc id="desc">文字は信頼された相手から耐久保存、ファイルは受信承認または別途承認済みautosaveを経て保存します。双方ともローカル受付は配達完了ではなく、保存ACK喪失時は元のIDで状態確認します。</desc>
