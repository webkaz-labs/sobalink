<rect x="79" y="528" width="242" height="30" rx="15" fill="#f0edff"/>
<text x="200.0" y="549" font-size="13" fill="#5844bf" font-weight="600" text-anchor="middle" id="label-27-box-226">Peer identity + explicit scope</text>
<path d="M40 489H360" fill="none" stroke="#e0e2ea" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/>
<text x="40" y="511" font-size="13" fill="#5844bf" font-weight="400" text-anchor="start" id="label-29-box-340">Separate entrance: peer protocol</text>
<rect x="158" y="635" width="84" height="64" rx="9" fill="#f8f8fb" stroke="#e0e2ea"/>
<rect x="168" y="645" width="64" height="34" rx="3" fill="#f0edff"/>
<path d="M188.0 691h24 M200.0 681v10" fill="none" stroke="#7f8799" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
