<path d="M203.8 571.0 L200 564 L196.2 571.0" fill="none" stroke="#6550d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M24 750H376" fill="none" stroke="#e0e2ea" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="24" y="770" font-size="13" fill="#596172" font-weight="400" text-anchor="start" id="label-37-box-356">An open endpoint never bypasses authorization.</text>
<text x="24" y="790" font-size="13" fill="#596172" font-weight="400" text-anchor="start" id="label-38-box-356">Do not expose or forward the local management API.</text>
<text x="24" y="810" font-size="13" fill="#596172" font-weight="400" text-anchor="start" id="label-39-box-356">Peer protocols never forward requests into /api.</text>
</svg>