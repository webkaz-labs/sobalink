<svg xmlns="http://www.w3.org/2000/svg" width="400" height="820" viewBox="0 0 400 820" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Management stays local.</title><desc id="desc">The local browser uses session and same-origin/CSRF checks for management. A peer uses the authenticated peer protocol and explicit scoped permission. Peer protocols never forward /api/command.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Noto Sans CJK JP","Noto Sans JP",sans-serif}</style>
<rect x="0" y="0" width="400" height="820" rx="0" fill="#ffffff"/>
<text x="24" y="33" font-size="13" fill="#5844bf" font-weight="600" text-anchor="start" id="label-4-box-356">sobalink  /  EXPLAINED</text>
<text x="24" y="73" font-size="22" fill="#272c38" font-weight="650" text-anchor="start" id="label-5-box-356">Management stays local.</text>
<text x="24" y="105" font-size="14" fill="#596172" font-weight="400" text-anchor="start" id="label-6-box-356">Shared Go core; separate entrances and authority.</text>
<rect x="24" y="139" width="352" height="467" rx="16" fill="#f8f8fb" stroke="#e0e2ea"/>
<text x="40" y="167" font-size="13" fill="#596172" font-weight="650" text-anchor="start" id="label-8-box-340">THIS DEVICE</text>
<rect x="94" y="188" width="212" height="30" rx="15" fill="#f0edff"/>
<text x="200.0" y="209" font-size="13" fill="#5844bf" font-weight="600" text-anchor="middle" id="label-10-box-196">Browser on this device</text>
