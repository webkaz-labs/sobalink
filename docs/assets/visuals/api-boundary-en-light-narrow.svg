<path d="M196.2 364.0 L200 371 L203.8 364.0" fill="none" stroke="#6550d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="54" y="380" width="292" height="66" rx="10" fill="#ffffff" stroke="#e0e2ea"/>
<text x="200" y="406" font-size="16" fill="#272c38" font-weight="600" text-anchor="middle" id="label-21-box-270">Go: current state + authority</text>
<text x="200" y="429" font-size="13" fill="#596172" font-weight="400" text-anchor="middle" id="label-22-box-270">Operation-specific permitted scope</text>
<path d="M321 543H340V514" fill="none" stroke="#6550d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
