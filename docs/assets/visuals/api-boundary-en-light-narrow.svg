<path d="M200 254 L200 262" fill="none" stroke="#6550d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M196.2 255.0 L200 262 L203.8 255.0" fill="none" stroke="#6550d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="200" y="247" font-size="12" fill="#596172" font-weight="400" text-anchor="middle" id="label-14-box-320">Session + Host / Origin + CSRF</text>
<rect x="54" y="268" width="292" height="66" rx="10" fill="#f0edff"/>
<text x="200" y="295" font-size="19" fill="#5844bf" font-weight="650" text-anchor="middle" id="label-16-box-270">/api/command</text>
<text x="200" y="319" font-size="13" fill="#5844bf" font-weight="400" text-anchor="middle" id="label-17-box-270">Numeric loopback only</text>
