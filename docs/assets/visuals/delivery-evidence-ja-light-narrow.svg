<svg xmlns="http://www.w3.org/2000/svg" width="400" height="800" viewBox="0 0 400 800" role="img" aria-labelledby="title desc" xml:lang="ja">
<title id="title">送信の停止と、保存の証拠は別。</title><desc id="desc">永続ファイル送信の作業状態と配達証拠は別です。取消や期限切れは追加送信を止めますが、相手の保存を取り消しません。不明な結果は元のIDで保存証拠を確認します。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Noto Sans CJK JP","Noto Sans JP",sans-serif}</style>
<rect x="0" y="0" width="400" height="800" rx="0" fill="#ffffff"/>
<text x="24" y="33" font-size="13" fill="#5844bf" font-weight="600" text-anchor="start" id="label-4-box-356">sobalink  /  図解</text>
<text x="24" y="73" font-size="22" fill="#272c38" font-weight="650" text-anchor="start" id="label-5-box-356">送信の停止と、保存の証拠は別。</text>
<text x="24" y="105" font-size="14" fill="#596172" font-weight="400" text-anchor="start" id="label-6-box-356">永続ファイル送信 · 失われた保存ACKの例</text>
<text x="24" y="150" font-size="18" fill="#272c38" font-weight="650" text-anchor="start" id="label-7-box-356">作業の状態</text>
<path d="M40 215H360" fill="none" stroke="#e0e2ea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="64" cy="215" r="6" fill="#6550d8"/>
<text x="64" y="246" font-size="13" fill="#5844bf" font-weight="600" text-anchor="middle" id="label-10-box-110">受付</text>
<circle cx="200.0" cy="215" r="6" fill="#6550d8"/>
<text x="200.0" y="246" font-size="13" fill="#5844bf" font-weight="600" text-anchor="middle" id="label-12-box-110">送信試行</text>
<circle cx="336" cy="215" r="6" fill="#7f8799"/>
<text x="336" y="246" font-size="13" fill="#596172" font-weight="600" text-anchor="middle" id="label-14-box-110">取消</text>
<text x="200.0" y="283" font-size="13" fill="#596172" font-weight="400" text-anchor="middle" id="label-15-box-352">取消後は追加送信を止める</text>
<text x="24" y="347" font-size="18" fill="#272c38" font-weight="650" text-anchor="start" id="label-16-box-356">配達の証拠</text>
<path d="M40 412H360" fill="none" stroke="#e0e2ea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="64" cy="412" r="6" fill="#6550d8"/>
<text x="64" y="443" font-size="13" fill="#5844bf" font-weight="600" text-anchor="middle" id="label-19-box-110">未試行</text>
<circle cx="200.0" cy="412" r="6" fill="#6550d8"/>
<text x="200.0" y="443" font-size="13" fill="#5844bf" font-weight="600" text-anchor="middle" id="label-21-box-110">不明</text>
<circle cx="336" cy="412" r="6" fill="#7f8799"/>
<text x="336" y="443" font-size="13" fill="#596172" font-weight="600" text-anchor="middle" id="label-23-box-110">保存確認</text>
<path d="M200.0 394Q268.0 344 336 394" fill="none" stroke="#7f8799" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
<text x="200.0" y="483" font-size="12" fill="#596172" font-weight="400" text-anchor="middle" id="label-25-box-352">元IDで、取得できた正確な保存証拠を照合</text>
<text x="200.0" y="510" font-size="12" fill="#596172" font-weight="400" text-anchor="middle" id="label-26-box-352">証拠が得られなければ、不明のままです。</text>
<path d="M200.0 298V325" fill="none" stroke="#6550d8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
<rect x="24" y="568" width="352" height="75" rx="12" fill="#f0edff"/>
<text x="40" y="590" font-size="12" fill="#5844bf" font-weight="400" text-anchor="start" id="label-29-box-320">「取消済み」「期限切れ」でも保存済みの場合があります。</text>
<text x="40" y="612" font-size="12" fill="#5844bf" font-weight="400" text-anchor="start" id="label-30-box-320">結果不明を「届いていない」と扱わない。</text>
<path d="M24 673H376" fill="none" stroke="#e0e2ea" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="24" y="693" font-size="13" fill="#596172" font-weight="400" text-anchor="start" id="label-32-box-356">保存確認は既読でも、現在の存在の保証でもありません。</text>
<text x="24" y="713" font-size="13" fill="#596172" font-weight="400" text-anchor="start" id="label-33-box-356">元のIDを保持。安易に新規送信を作り直さない。</text>
<text x="24" y="733" font-size="13" fill="#596172" font-weight="400" text-anchor="start" id="label-34-box-356">取り消しで、既知の保存証拠は消えません。</text>
</svg>