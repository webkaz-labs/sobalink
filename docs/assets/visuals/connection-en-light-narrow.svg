<title id="title">The service you choose. The connection you need.</title><desc id="desc">An application connects to the local sobalink listener. Traffic crosses the selected network path to the peer sobalink, which checks sharing permissions and forwards to the service. Traffic is bidirectional. Direct and Relay describe routes; availability depends on configuration and network conditions.</desc>
