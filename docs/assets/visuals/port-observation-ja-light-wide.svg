<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img" aria-labelledby="title desc" xml:lang="ja">
<title id="title">空きポートは、予約ではない。</title><desc id="desc">停止中の定義に対する一時bindの観測。全ソケットを閉じて候補を返し、別の保存や起動で再確認します。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Noto Sans CJK JP","Noto Sans JP",sans-serif}</style>
<rect x="0" y="0" width="960" height="760" rx="0" fill="#ffffff"/>
<text x="24" y="33" font-size="13" fill="#5844bf" font-weight="600" text-anchor="start" id="label-4-box-916">sobalink  /  図解</text>
<text x="24" y="73" font-size="28" fill="#272c38" font-weight="650" text-anchor="start" id="label-5-box-916">空きポートは、予約ではない。</text>
<text x="24" y="105" font-size="14" fill="#596172" font-weight="400" text-anchor="start" id="label-6-box-916">停止中の接続 · 元のリビジョンを維持</text>
<rect x="24" y="132" width="912" height="104" rx="12" fill="#f8f8fb" stroke="#e0e2ea"/>
<text x="40" y="160" font-size="18" fill="#272c38" font-weight="600" text-anchor="start" id="label-8-box-900">1  一時的にポートを開いて確認</text>
<text x="40" y="187" font-size="15" fill="#596172" font-weight="400" text-anchor="start" id="label-9-box-900">元のポート → 使用中の場合だけ候補を調べる</text>
<text x="40" y="209" font-size="15" fill="#596172" font-weight="400" text-anchor="start" id="label-10-box-900">TCP/UDP・loopback・リモート範囲は固定</text>
<path d="M48 278H912" fill="none" stroke="#7f8799" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="48" cy="278" r="5" fill="#6550d8"/>
<circle cx="912" cy="278" r="5" fill="#6550d8"/>
<text x="48" y="264" font-size="13" fill="#5844bf" font-weight="400" text-anchor="start" id="label-14-box-892">開く</text>
<text x="912" y="264" font-size="13" fill="#5844bf" font-weight="400" text-anchor="end" id="label-15-box-76">全て閉じる</text>
<rect x="380.0" y="293" width="200" height="30" rx="15" fill="#f0edff"/>
<text x="480.0" y="314" font-size="13" fill="#5844bf" font-weight="600" text-anchor="middle" id="label-17-box-184">候補 = 今この瞬間の観測</text>
<path d="M40 333 L40 366" fill="none" stroke="#7f8799" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
<path d="M36.2 359.0 L40 366 L43.8 359.0" fill="none" stroke="#7f8799" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="480.0" y="354" font-size="12" fill="#596172" font-weight="400" text-anchor="middle" id="label-20-box-940">閉じた後は、他のアプリが取得する場合も</text>
<text x="24" y="388" font-size="16" fill="#272c38" font-weight="600" text-anchor="start" id="label-21-box-916">2  対応を確認して、別途保存／起動</text>
<text x="210" y="428" font-size="13" fill="#596172" font-weight="400" text-anchor="middle" id="label-22-box-400">ローカル</text>
<text x="680" y="428" font-size="13" fill="#596172" font-weight="400" text-anchor="middle" id="label-23-box-540">リモート</text>
<rect x="164" y="440" width="92" height="30" rx="15" fill="#f0edff"/>
<text x="210.0" y="461" font-size="13" fill="#5844bf" font-weight="600" text-anchor="middle" id="label-25-box-76">49152</text>
<rect x="634" y="440" width="92" height="30" rx="15" fill="#f0edff"/>
<text x="680.0" y="461" font-size="13" fill="#5844bf" font-weight="600" text-anchor="middle" id="label-27-box-76">8000</text>
<path d="M264 455 L626 455" fill="none" stroke="#6550d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M619.0 458.8 L626 455 L619.0 451.2" fill="none" stroke="#6550d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="164" y="482" width="92" height="30" rx="15" fill="#f0edff"/>
<text x="210.0" y="503" font-size="13" fill="#5844bf" font-weight="600" text-anchor="middle" id="label-31-box-76">49153</text>
<rect x="634" y="482" width="92" height="30" rx="15" fill="#f0edff"/>
<text x="680.0" y="503" font-size="13" fill="#5844bf" font-weight="600" text-anchor="middle" id="label-33-box-76">8002</text>
<path d="M264 497 L626 497" fill="none" stroke="#6550d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M619.0 500.8 L626 497 L619.0 493.2" fill="none" stroke="#6550d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="680" y="548" font-size="13" fill="#596172" font-weight="400" text-anchor="middle" id="label-36-box-540">8001 は除外</text>
<text x="24" y="577" font-size="13" fill="#596172" font-weight="400" text-anchor="start" id="label-37-box-916">元の設定が変わったら、候補を再確認。</text>
<rect x="24" y="584" width="912" height="72" rx="10" fill="#f0edff"/>
<text x="40" y="608" font-size="17" fill="#5844bf" font-weight="600" text-anchor="start" id="label-39-box-900">3  実際の起動で、もう一度開く</text>
<text x="40" y="633" font-size="15" fill="#5844bf" font-weight="400" text-anchor="start" id="label-40-box-900">保存時はリビジョン確認。起動時に全ポートを再確認。</text>
<path d="M24 680H936" fill="none" stroke="#e0e2ea" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="24" y="700" font-size="13" fill="#596172" font-weight="400" text-anchor="start" id="label-42-box-916">候補選択だけでは保存・共有・起動しません。</text>
<text x="24" y="720" font-size="13" fill="#596172" font-weight="400" text-anchor="start" id="label-43-box-916">起動時に競合したら停止。別ポートへ勝手に変更しません。</text>
</svg>