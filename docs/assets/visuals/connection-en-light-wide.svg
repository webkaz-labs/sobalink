<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Bring the service you choose within reach.</title><desc id="desc">Conceptual diagram. An app on the left device connects to local sobalink. Traffic crosses a Direct or Relay path in the selected network. The right device’s sobalink checks the current peer, port and lifetime permissions before forwarding traffic to the shared service. The shield represents this permission check. Traffic is bidirectional. A reachable path and separate application setup and authentication are required.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans CJK JP",sans-serif}</style>
