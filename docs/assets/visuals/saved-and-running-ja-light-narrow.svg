<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 872" width="360" height="872" role="img" aria-labelledby="title desc" xml:lang="ja"><title id="title">保存した設定は、起動して使う。</title><desc id="desc">保存したサービス定義は、それだけでは待受や以前の許可を再開しません。手動で起動すると、現在のネットワークと相手の識別情報を再確認します。共有は許可内容を確認します。開始済みはアプリのログインや遠隔処理の完了を示しません。個別に承認した起動時接続は別の設定です。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Noto Sans CJK JP","Noto Sans JP",sans-serif}</style>
<rect x="0" y="0" width="360" height="872" rx="0" fill="#ffffff"/>
<g transform="translate(24 25) rotate(-23 12 12)" fill="#6550d8" aria-hidden="true"><rect width="6" height="24" rx="3"/><rect x="9" y="5" width="6" height="16" rx="3"/><rect x="18" y="2" width="6" height="22" rx="3" opacity=".6"/></g>
<text x="60" y="45" font-size="22" fill="#272c38" font-weight="650">sobalink</text>
<text x="24" y="100" font-size="22" fill="#272c38" font-weight="650">保存した設定は、</text>
<text x="24" y="133" font-size="22" fill="#272c38" font-weight="650">起動して使う。</text>
<text x="24" y="168" font-size="14" fill="#596172" font-weight="400">保存済みサービスを手動で開始する場合</text>
<rect x="16" y="192" width="328" height="162" rx="16" fill="#f8f8fb"/>
<text x="32" y="219" font-size="13" fill="#5844bf" font-weight="600">1 · 設定</text>
<text x="32" y="250" font-size="20" fill="#272c38" font-weight="650">保存済み</text>
<text x="32" y="278" font-size="15" fill="#596172" font-weight="400">相手・サービス・期限を</text>
<text x="32" y="300" font-size="15" fill="#596172" font-weight="400">設定として保存</text>
<text x="32" y="332" font-size="13" fill="#5844bf" font-weight="500">保存だけでは開始しない</text>
<path d="M180 357v16m-4-5 4 5 4-5" fill="none" stroke="#7f8799" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="16" y="377" width="328" height="162" rx="16" fill="#f8f8fb"/>
<text x="32" y="404" font-size="13" fill="#5844bf" font-weight="600">2 · 操作</text>
<text x="32" y="435" font-size="20" fill="#272c38" font-weight="650">内容を確認して起動</text>
<text x="32" y="463" font-size="15" fill="#596172" font-weight="400">現在のネットワークと</text>
<text x="32" y="485" font-size="15" fill="#596172" font-weight="400">相手の識別情報を再確認</text>
<text x="32" y="517" font-size="13" fill="#5844bf" font-weight="500">共有は許可内容も確認</text>
<path d="M180 542v16m-4-5 4 5 4-5" fill="none" stroke="#7f8799" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="16" y="562" width="328" height="162" rx="16" fill="#f8f8fb"/>
<text x="32" y="589" font-size="13" fill="#5844bf" font-weight="600">3 · 状態</text>
<text x="32" y="620" font-size="20" fill="#272c38" font-weight="650">開始済み</text>
<text x="32" y="648" font-size="15" fill="#596172" font-weight="400">許可された範囲で</text>
<text x="32" y="670" font-size="15" fill="#596172" font-weight="400">通信の準備ができた状態</text>
<text x="32" y="702" font-size="13" fill="#5844bf" font-weight="500">アプリで接続・認証を確認</text>
<text x="24" y="772" font-size="13" fill="#596172" font-weight="400">開始済みは、アプリの成功や</text>
<text x="24" y="797" font-size="13" fill="#596172" font-weight="400">処理完了の証明ではありません。</text>
<text x="24" y="822" font-size="13" fill="#596172" font-weight="400">起動時の自動接続は別途承認する設定です。</text>
</svg>