<svg xmlns="http://www.w3.org/2000/svg" width="400" height="800" viewBox="0 0 400 800" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Text and files: save gates.</title><desc id="desc">Both need current peer trust. Files also need batch acceptance or separately configured autosave. Local acceptance, receiver saving and save confirmation are separate.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Noto Sans CJK JP","Noto Sans JP",sans-serif}</style>
<rect x="0" y="0" width="400" height="800" rx="0" fill="#ffffff"/>
<text x="24" y="33" font-size="13" fill="#5844bf" font-weight="600" text-anchor="start" id="label-4-box-356">sobalink  /  EXPLAINED</text>
<text x="24" y="73" font-size="22" fill="#272c38" font-weight="650" text-anchor="start" id="label-5-box-356">Text and files: save gates.</text>
<text x="24" y="105" font-size="14" fill="#596172" font-weight="400" text-anchor="start" id="label-6-box-356">Both need current peer trust.</text>
<text x="24" y="126" font-size="12" fill="#596172" font-weight="400" text-anchor="start" id="label-7-box-356">Original deadline; both devices running and reachable</text>
<text x="24" y="149" font-size="18" fill="#272c38" font-weight="650" text-anchor="start" id="label-8-box-356">Text</text>
<text x="125" y="149" font-size="14" fill="#5844bf" font-weight="400" text-anchor="start" id="label-9-box-255">Save the text durably</text>
<path d="M24 167H376" fill="none" stroke="#e0e2ea" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="24" y="202" font-size="18" fill="#272c38" font-weight="650" text-anchor="start" id="label-11-box-356">Files</text>
<text x="125" y="196" font-size="13" fill="#5844bf" font-weight="400" text-anchor="start" id="label-12-box-245">Batch consent / autosave</text>
<text x="125" y="218" font-size="13" fill="#5844bf" font-weight="400" text-anchor="start" id="label-13-box-245">→ transfer and save</text>
<path d="M24 238H376" fill="none" stroke="#e0e2ea" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="24" y="272" font-size="17" fill="#272c38" font-weight="650" text-anchor="start" id="label-15-box-356">Shared: confirm the saved evidence</text>
<text x="60" y="313" font-size="14" fill="#596172" font-weight="400" text-anchor="middle" id="label-16-box-100">Sender</text>
<text x="340" y="313" font-size="14" fill="#596172" font-weight="400" text-anchor="middle" id="label-17-box-100">Receiver</text>
<path d="M60 330V585 M340 330V585" fill="none" stroke="#e0e2ea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/>
<circle cx="60" cy="345" r="5" fill="#6550d8"/>
<text x="74" y="350" font-size="14" fill="#272c38" font-weight="400" text-anchor="start" id="label-20-box-306">Accepted locally</text>
<text x="200" y="386" font-size="13" fill="#5844bf" font-weight="400" text-anchor="middle" id="label-21-box-350">Send and save under the gates above</text>
<path d="M60 403 L340 403" fill="none" stroke="#6550d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M333.0 406.8 L340 403 L333.0 399.2" fill="none" stroke="#6550d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="316" y="425" width="48" height="40" rx="5" fill="#f0edff" stroke="#e0e2ea"/>
<path d="M325 435h30" fill="none" stroke="#6550d8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M325 444h30" fill="none" stroke="#6550d8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M325 453h30" fill="none" stroke="#6550d8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="200" y="450" font-size="15" fill="#272c38" font-weight="600" text-anchor="middle" id="label-28-box-220">Saved on receiver</text>
<path d="M340 496 L60 496" fill="none" stroke="#7f8799" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/>
<path d="M67.0 492.2 L60 496 L67.0 499.8" fill="none" stroke="#7f8799" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="183" y="481" width="34" height="30" rx="0" fill="#ffffff"/>
<path d="M193 489l14 14 M207 489l-14 14" fill="none" stroke="#6550d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="200" y="535" font-size="14" fill="#596172" font-weight="400" text-anchor="middle" id="label-33-box-380">The save receipt may be lost</text>
<rect x="25" y="563" width="70" height="30" rx="15" fill="#f0edff"/>
<text x="60.0" y="584" font-size="13" fill="#5844bf" font-weight="600" text-anchor="middle" id="label-35-box-54">Same ID</text>
<rect x="24" y="621" width="352" height="74" rx="12" fill="#f0edff"/>
<text x="40" y="647" font-size="13" fill="#5844bf" font-weight="400" text-anchor="start" id="label-37-box-320">Unknown can still mean saved.</text>
<text x="40" y="669" font-size="13" fill="#5844bf" font-weight="400" text-anchor="start" id="label-38-box-320">Inspect the original ID before a new send.</text>
<path d="M24 713H376" fill="none" stroke="#e0e2ea" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="24" y="733" font-size="13" fill="#596172" font-weight="400" text-anchor="start" id="label-40-box-356">Save evidence is not reading or continued retention.</text>
<text x="24" y="753" font-size="13" fill="#596172" font-weight="400" text-anchor="start" id="label-41-box-356">Cancellation cannot recall saved content.</text>
</svg>