<svg xmlns="http://www.w3.org/2000/svg" width="960" height="690" viewBox="0 0 960 690" role="img" aria-labelledby="title desc" xml:lang="ja">
<title id="title">つながることと、許可すること。</title><desc id="desc">接続、文字とファイル申込みへの信頼、ファイル保存同意、自動保存、サービスの相手・port・期限は独立した許可です。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Noto Sans CJK JP","Noto Sans JP",sans-serif}</style>
<rect x="0" y="0" width="960" height="690" rx="0" fill="#ffffff"/>
<text x="24" y="33" font-size="13" fill="#5844bf" font-weight="600" text-anchor="start" id="label-4-box-916">sobalink  /  図解</text>
<text x="24" y="73" font-size="28" fill="#272c38" font-weight="650" text-anchor="start" id="label-5-box-916">つながることと、許可すること。</text>
<text x="24" y="105" font-size="15" fill="#596172" font-weight="400" text-anchor="start" id="label-6-box-916">接続できても、受信や共有は別に選びます。</text>
<rect x="24" y="136" width="205" height="30" rx="15" fill="#f0edff"/>
<text x="126.5" y="157" font-size="13" fill="#5844bf" font-weight="600" text-anchor="middle" id="label-8-box-189">接続済みの経路</text>
<path d="M40 171V197H710" fill="none" stroke="#e0e2ea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M240 197V232 M710 197V232" fill="none" stroke="#e0e2ea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="24" y="232" width="436" height="278" rx="12" fill="#f8f8fb" stroke="#e0e2ea"/>
<text x="40" y="262" font-size="17" fill="#272c38" font-weight="650" text-anchor="start" id="label-12-box-404">A  文字・ファイルを受信</text>
<rect x="40" y="282" width="404" height="30" rx="15" fill="#f0edff"/>
<text x="242.0" y="303" font-size="13" fill="#5844bf" font-weight="600" text-anchor="middle" id="label-14-box-388">この送信元を信頼</text>
<path d="M242.0 319v15H101v17 M242.0 334H378v17" fill="none" stroke="#6550d8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="101" y="372" font-size="14" fill="#5844bf" font-weight="400" text-anchor="middle" id="label-16-box-140">文字を受信</text>
<text x="378" y="372" font-size="14" fill="#5844bf" font-weight="400" text-anchor="middle" id="label-17-box-140">ファイル申込み</text>
<path d="M378 384 L378 407" fill="none" stroke="#6550d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M374.2 400.0 L378 407 L381.8 400.0" fill="none" stroke="#6550d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="378" y="432" font-size="14" fill="#272c38" font-weight="600" text-anchor="middle" id="label-20-box-160">保存の同意</text>
<text x="40" y="465" font-size="14" fill="#596172" font-weight="400" text-anchor="start" id="label-21-box-404">通常: バッチごとに受信承認</text>
<text x="40" y="487" font-size="14" fill="#596172" font-weight="400" text-anchor="start" id="label-22-box-404">自動保存: 相手と保存先を別途承認</text>
<rect x="500" y="232" width="436" height="194" rx="12" fill="#f8f8fb" stroke="#e0e2ea"/>
<text x="516" y="262" font-size="17" fill="#272c38" font-weight="650" text-anchor="start" id="label-24-box-404">B  サービス共有</text>
<rect x="516" y="282" width="404" height="30" rx="15" fill="#f0edff"/>
<text x="718.0" y="303" font-size="13" fill="#5844bf" font-weight="600" text-anchor="middle" id="label-26-box-388">相手・ポート・期限を許可</text>
<path d="M718.0 321 L718.0 347" fill="none" stroke="#6550d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M714.2 340.0 L718.0 347 L721.8 340.0" fill="none" stroke="#6550d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="718.0" y="375" font-size="14" fill="#5844bf" font-weight="600" text-anchor="middle" id="label-29-box-406">指定したサービスだけを公開</text>
<text x="718.0" y="403" font-size="12" fill="#596172" font-weight="400" text-anchor="middle" id="label-30-box-406">アプリの起動・認証も別途必要</text>
<path d="M24 590H936" fill="none" stroke="#e0e2ea" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="24" y="610" font-size="13" fill="#596172" font-weight="400" text-anchor="start" id="label-32-box-916">A と B は独立。片方の承認では他方は有効になりません。</text>
<text x="24" y="630" font-size="13" fill="#596172" font-weight="400" text-anchor="start" id="label-33-box-916">受信側が、その端末への許可を決めます。</text>
<text x="24" y="650" font-size="13" fill="#596172" font-weight="400" text-anchor="start" id="label-34-box-916">逆方向は、もう一方の端末で別に許可します。</text>
</svg>