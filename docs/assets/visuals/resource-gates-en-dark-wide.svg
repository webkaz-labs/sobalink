<svg xmlns="http://www.w3.org/2000/svg" width="960" height="740" viewBox="0 0 960 740" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Policy ≠ available resources.</title><desc id="desc">Logical allowance, finite resource budgets and actual OS capacity are independent constraints. Raising capacity does not change authority or lifetime.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Noto Sans CJK JP","Noto Sans JP",sans-serif}</style>
<rect x="0" y="0" width="960" height="740" rx="0" fill="#1d202a"/>
<text x="24" y="33" font-size="13" fill="#c0aeff" font-weight="600" text-anchor="start" id="label-4-box-916">sobalink  /  EXPLAINED</text>
<text x="24" y="73" font-size="28" fill="#e8e9f0" font-weight="650" text-anchor="start" id="label-5-box-916">Policy ≠ available resources.</text>
<text x="24" y="105" font-size="14" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-6-box-916">Admission needs every applicable condition.</text>
<rect x="24" y="139" width="912" height="414" rx="16" fill="#191c24" stroke="#454959"/>
<rect x="44" y="237" width="872" height="316" rx="16" fill="#30294b" stroke="#454959"/>
<rect x="64" y="335" width="832" height="218" rx="16" fill="#1d202a" stroke="#454959"/>
<text x="40" y="168" font-size="18" fill="#e8e9f0" font-weight="650" text-anchor="start" id="label-10-box-900">1  Logical choice</text>
<text x="40" y="196" font-size="14" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-11-box-900">Example: file size / entry count</text>
<text x="40" y="218" font-size="14" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-12-box-900">default / limited / unlimited</text>
<text x="60" y="267" font-size="18" fill="#e8e9f0" font-weight="650" text-anchor="start" id="label-13-box-880">2  Finite resource budgets</text>
<text x="60" y="294" font-size="15" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-14-box-880">Sender spool, receiver reservations</text>
<text x="60" y="316" font-size="15" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-15-box-880">No unlimited option; listeners / flows stay finite.</text>
<text x="80" y="365" font-size="18" fill="#e8e9f0" font-weight="650" text-anchor="start" id="label-16-box-800">3  Actual available resources</text>
<text x="80" y="395" font-size="15" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-17-box-800">Disk, memory and OS limits</text>
<text x="80" y="417" font-size="15" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-18-box-800">Work may fail below the budget.</text>
<text x="80" y="449" font-size="12" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-19-box-860">Disk headroom (schematic)</text>
<rect x="80" y="464" width="800" height="22" rx="4" fill="#191c24" stroke="#454959"/>
<rect x="80" y="464" width="440.00000000000006" height="22" rx="4" fill="#30294b"/>
<rect x="520.0" y="464" width="360.0" height="22" rx="0" fill="#454959"/>
<text x="80" y="510" font-size="12" fill="#c0aeff" font-weight="400" text-anchor="start" id="label-23-box-860">Data + reservations</text>
<text x="880" y="510" font-size="12" fill="#bdc5d8" font-weight="400" text-anchor="end" id="label-24-box-140">Free-space margin</text>
<path d="M480.0 562 L480.0 595" fill="none" stroke="#a18bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M476.2 588.0 L480.0 595 L483.8 588.0" fill="none" stroke="#a18bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="360.0" y="605" width="240" height="30" rx="15" fill="#30294b"/>
<text x="480.0" y="626" font-size="13" fill="#c0aeff" font-weight="600" text-anchor="middle" id="label-28-box-224">Compare usage / effective limits</text>
<path d="M24 649H936" fill="none" stroke="#454959" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="24" y="669" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-30-box-916">Capacity changes do not expand permission or lifetime.</text>
<text x="24" y="689" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-31-box-916">Logical unlimited still obeys finite resource budgets.</text>
<text x="24" y="709" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-32-box-916">Default resolves to a value, not zero or unlimited.</text>
</svg>