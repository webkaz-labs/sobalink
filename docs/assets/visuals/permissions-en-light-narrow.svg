<svg xmlns="http://www.w3.org/2000/svg" width="400" height="850" viewBox="0 0 400 850" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Separate gates, separate choices.</title><desc id="desc">Connectivity, sender trust, file-save consent, autosave and scoped service sharing are independent permissions.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Noto Sans CJK JP","Noto Sans JP",sans-serif}</style>
<rect x="0" y="0" width="400" height="850" rx="0" fill="#ffffff"/>
<text x="24" y="33" font-size="13" fill="#5844bf" font-weight="600" text-anchor="start" id="label-4-box-356">sobalink  /  EXPLAINED</text>
<text x="24" y="73" font-size="22" fill="#272c38" font-weight="650" text-anchor="start" id="label-5-box-356">Separate gates, separate choices.</text>
<text x="24" y="105" font-size="13" fill="#596172" font-weight="400" text-anchor="start" id="label-6-box-356">A connection does not approve receiving or sharing.</text>
<rect x="24" y="136" width="205" height="30" rx="15" fill="#f0edff"/>
<text x="126.5" y="157" font-size="13" fill="#5844bf" font-weight="600" text-anchor="middle" id="label-8-box-189">Connected transport</text>
<path d="M40 171V551" fill="none" stroke="#e0e2ea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M40 232H56" fill="none" stroke="#e0e2ea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="56" y="207" width="320" height="278" rx="12" fill="#f8f8fb" stroke="#e0e2ea"/>
<text x="72" y="237" font-size="17" fill="#272c38" font-weight="650" text-anchor="start" id="label-12-box-288">A  Receive messages / files</text>
<rect x="72" y="257" width="288" height="30" rx="15" fill="#f0edff"/>
<text x="216.0" y="278" font-size="13" fill="#5844bf" font-weight="600" text-anchor="middle" id="label-14-box-272">Trust this sender</text>
<path d="M216.0 294v15H133v17 M216.0 309H294v17" fill="none" stroke="#6550d8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="133" y="347" font-size="14" fill="#5844bf" font-weight="400" text-anchor="middle" id="label-16-box-140">Receive text</text>
<text x="294" y="347" font-size="14" fill="#5844bf" font-weight="400" text-anchor="middle" id="label-17-box-140">File offer</text>
<path d="M294 359 L294 382" fill="none" stroke="#6550d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M290.2 375.0 L294 382 L297.8 375.0" fill="none" stroke="#6550d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="294" y="407" font-size="14" fill="#272c38" font-weight="600" text-anchor="middle" id="label-20-box-160">Consent to save</text>
<text x="72" y="440" font-size="12" fill="#596172" font-weight="400" text-anchor="start" id="label-21-box-288">Default: accept each batch</text>
<text x="72" y="462" font-size="12" fill="#596172" font-weight="400" text-anchor="start" id="label-22-box-288">Autosave: separately approve peer + folder</text>
<path d="M40 551H56" fill="none" stroke="#e0e2ea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="56" y="526" width="320" height="194" rx="12" fill="#f8f8fb" stroke="#e0e2ea"/>
<text x="72" y="556" font-size="17" fill="#272c38" font-weight="650" text-anchor="start" id="label-25-box-288">B  Share a service</text>
<rect x="72" y="576" width="288" height="30" rx="15" fill="#f0edff"/>
<text x="216.0" y="597" font-size="13" fill="#5844bf" font-weight="600" text-anchor="middle" id="label-27-box-272">Allow peers, ports and lifetime</text>
<path d="M216.0 615 L216.0 641" fill="none" stroke="#6550d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M212.2 634.0 L216.0 641 L219.8 634.0" fill="none" stroke="#6550d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="216.0" y="669" font-size="14" fill="#5844bf" font-weight="600" text-anchor="middle" id="label-30-box-290">Expose only the scoped service</text>
<text x="216.0" y="697" font-size="12" fill="#596172" font-weight="400" text-anchor="middle" id="label-31-box-290">App setup / login remains separate</text>
<path d="M24 758H376" fill="none" stroke="#e0e2ea" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="24" y="778" font-size="13" fill="#596172" font-weight="400" text-anchor="start" id="label-33-box-356">A and B require independent approvals.</text>
<text x="24" y="798" font-size="13" fill="#596172" font-weight="400" text-anchor="start" id="label-34-box-356">The receiving device controls its own permissions.</text>
<text x="24" y="818" font-size="13" fill="#596172" font-weight="400" text-anchor="start" id="label-35-box-356">Reverse direction needs the other receiver’s approval.</text>
</svg>