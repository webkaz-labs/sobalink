<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 540" width="1040" height="540" role="img" aria-labelledby="title desc" xml:lang="ja"><title id="title">受付から、相手の保存確認へ。</title><desc id="desc">永続送信待ちへの受付は送信側での記録であり、相手への配達完了ではありません。受信承認または明示設定済みの自動保存により転送後のファイルが保存され、相手の永続的な記録によって送信側が保存を確認します。結果が不明でも保存済みの可能性があるため、元の要求を確認し、新しい要求で安易に再送しません。保存確認は既読や現在もファイルが残ることの保証ではありません。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Noto Sans CJK JP","Noto Sans JP",sans-serif}</style>
<rect x="0" y="0" width="1040" height="540" rx="0" fill="#1d202a"/>
<g transform="translate(32 25) rotate(-23 12 12)" fill="#a18bff" aria-hidden="true"><rect width="6" height="24" rx="3"/><rect x="9" y="5" width="6" height="16" rx="3"/><rect x="18" y="2" width="6" height="22" rx="3" opacity=".6"/></g>
<text x="68" y="45" font-size="22" fill="#e8e9f0" font-weight="650">sobalink</text>
<text x="32" y="108" font-size="30" fill="#e8e9f0" font-weight="650">受付から、相手の保存確認へ。</text>
<text x="32" y="144" font-size="17" fill="#bdc5d8" font-weight="400">永続ファイル送信待ちの例：期限内・両端末が起動し接続可能な場合</text>
<rect x="32" y="188" width="304" height="238" rx="16" fill="#191c24"/>
<text x="52" y="222" font-size="14" fill="#c0aeff" font-weight="600">送信側</text>
<text x="52" y="266" font-size="22" fill="#e8e9f0" font-weight="650">この端末で受付</text>
<text x="52" y="306" font-size="17" fill="#bdc5d8" font-weight="400">確認した送信を</text>
<text x="52" y="333" font-size="17" fill="#bdc5d8" font-weight="400">この端末に記録</text>
<rect x="52" y="363" width="264" height="41" rx="8" fill="#30294b"/>
<text x="60" y="389" font-size="14" fill="#c0aeff" font-weight="500">相手の保存は、まだ未確認</text>
<path d="M344 306h16m-5-4 5 4-5 4" fill="none" stroke="#818ba0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="368" y="188" width="304" height="238" rx="16" fill="#191c24"/>
<text x="388" y="222" font-size="14" fill="#c0aeff" font-weight="600">受信側</text>
<text x="388" y="266" font-size="22" fill="#e8e9f0" font-weight="650">相手の端末に保存</text>
<text x="388" y="306" font-size="17" fill="#bdc5d8" font-weight="400">受信の同意・転送後に</text>
<text x="388" y="333" font-size="17" fill="#bdc5d8" font-weight="400">相手の保存先へ保存</text>
<rect x="388" y="363" width="264" height="41" rx="8" fill="#30294b"/>
<text x="396" y="389" font-size="14" fill="#c0aeff" font-weight="500">送信側に結果が届かない場合も</text>
<path d="M680 306h16m-5-4 5 4-5 4" fill="none" stroke="#818ba0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="704" y="188" width="304" height="238" rx="16" fill="#191c24"/>
<text x="724" y="222" font-size="14" fill="#c0aeff" font-weight="600">送信側の確認</text>
<text x="724" y="266" font-size="22" fill="#e8e9f0" font-weight="650">保存の記録を確認</text>
<text x="724" y="306" font-size="17" fill="#bdc5d8" font-weight="400">相手の永続的な記録で</text>
<text x="724" y="333" font-size="17" fill="#bdc5d8" font-weight="400">保存を確認</text>
<rect x="724" y="363" width="264" height="41" rx="8" fill="#30294b"/>
<text x="732" y="389" font-size="14" fill="#c0aeff" font-weight="500">既読を示すものではない</text>
<path d="M32 455H1008" stroke="#343846"/>
<text x="32" y="485" font-size="15" fill="#bdc5d8" font-weight="400">到着状況が不明でも、すでに保存済みの場合があります。</text>
<text x="32" y="512" font-size="15" fill="#bdc5d8" font-weight="400">元の送信記録を確認します。新しい送信を安易に作り直しません。</text>
</svg>