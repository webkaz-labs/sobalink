<text x="200" y="211" font-size="12" fill="#bdc5d8" font-weight="400" text-anchor="middle" id="label-18-box-70">入口</text>
<text x="24" y="364" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-19-box-356">1  実際のローカル接続先をアプリに設定</text>
<path d="M282 337V400H16V545" fill="none" stroke="#a18bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="158" y="386" width="218" height="30" rx="15" fill="#30294b"/>
<text x="267.0" y="407" font-size="13" fill="#c0aeff" font-weight="600" text-anchor="middle" id="label-22-box-202">2  選んだネットワーク</text>
<text x="24" y="458" font-size="16" fill="#e8e9f0" font-weight="650" text-anchor="start" id="label-23-box-356">相手の端末: 共有する側</text>
<rect x="36" y="477" width="328" height="162" rx="14" fill="#191c24" stroke="#454959"/>
<rect x="48" y="489" width="304" height="138" rx="7" fill="#1d202a" stroke="#454959"/>
