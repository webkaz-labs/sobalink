<rect x="257" y="522" width="76" height="17" rx="4" fill="#30294b" stroke="#454959"/>
<rect x="257" y="546" width="76" height="17" rx="4" fill="#30294b" stroke="#454959"/>
<text x="280" y="598" font-size="15" fill="#e8e9f0" font-weight="600" text-anchor="middle" id="label-37-box-120">サービス</text>
<text x="24" y="689" font-size="12" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-38-box-356">3  相手・ポート・期限に合う共有だけ許可</text>
<path d="M24 725H376" fill="none" stroke="#454959" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="24" y="745" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-40-box-356">アプリの起動・認証と、経路の到達性は別に確認。</text>
<text x="24" y="765" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-41-box-356">線は実際の接続状態を表示していません。</text>
<text x="24" y="785" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-42-box-356">ローカル入口と相手の共有先は別の接続先です。</text>
</svg>