<text x="112" y="550" font-size="14" fill="#c0aeff" font-weight="650" text-anchor="middle" id="label-28-box-80">sobalink</text>
<path d="M16 545 L72 545" fill="none" stroke="#a18bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
