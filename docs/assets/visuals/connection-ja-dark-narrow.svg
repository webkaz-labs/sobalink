<svg xmlns="http://www.w3.org/2000/svg" width="400" height="800" viewBox="0 0 400 800" role="img" aria-labelledby="title desc" xml:lang="ja">
<title id="title">使いたいサービスだけをつなぐ。</title><desc id="desc">2台のsobalink間のサービス共有例。アプリはローカル入口を使い、相手の現在の共有許可を経て共有サービスへ届きます。線は構造であり接続確認ではありません。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Noto Sans CJK JP","Noto Sans JP",sans-serif}</style>
<rect x="0" y="0" width="400" height="800" rx="0" fill="#1d202a"/>
<text x="24" y="33" font-size="13" fill="#c0aeff" font-weight="600" text-anchor="start" id="label-4-box-356">sobalink  /  図解</text>
<text x="24" y="73" font-size="22" fill="#e8e9f0" font-weight="650" text-anchor="start" id="label-5-box-356">使いたいサービスだけをつなぐ。</text>
<text x="24" y="105" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-6-box-356">sobalink 同士で共有する例</text>
<text x="24" y="144" font-size="16" fill="#e8e9f0" font-weight="650" text-anchor="start" id="label-7-box-356">この端末: 使う側</text>
<rect x="36" y="160" width="328" height="162" rx="14" fill="#191c24" stroke="#454959"/>
<rect x="48" y="172" width="304" height="138" rx="7" fill="#1d202a" stroke="#454959"/>
<path d="M24 322H376L361 336H39Z" fill="none" stroke="#9ba4b7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="66" y="198" width="90" height="62" rx="8" fill="#30294b"/>
<path d="M66 211h90 M95 225l-7 8 7 8 M126 225l7 8-7 8" fill="none" stroke="#a18bff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="111" y="286" font-size="15" fill="#e8e9f0" font-weight="600" text-anchor="middle" id="label-13-box-100">アプリ</text>
<circle cx="282" cy="230" r="34" fill="#30294b"/>
<text x="282" y="235" font-size="14" fill="#c0aeff" font-weight="650" text-anchor="middle" id="label-15-box-80">sobalink</text>
<path d="M163 230 L241 230" fill="none" stroke="#a18bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
