<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 816" width="360" height="816" role="img" aria-labelledby="title desc" xml:lang="ja">
<title id="title">選んだサービスを、もう一方の端末へ。</title><desc id="desc">この端末のアプリからローカルの sobalink に接続し、選択したネットワークの経路を通り、相手の sobalink が許可を確認して共有サービスへ転送する例。通信は双方向です。Direct と Relay は経路を表し、利用できる経路は設定とネットワーク条件に依存します。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Noto Sans CJK JP","Noto Sans JP",sans-serif} </style>
<rect x="0" y="0" width="360" height="816" rx="0" fill="#1d202a"/>
<g transform="translate(24 25) rotate(-23 12 12)" fill="#a18bff" aria-hidden="true"><rect x="0" y="0" width="6" height="24" rx="3"/><rect x="9" y="5" width="6" height="16" rx="3"/><rect x="18" y="2" width="6" height="22" rx="3" opacity=".6"/></g>
<text x="60" y="45" font-size="22" fill="#e8e9f0" font-weight="650" text-anchor="start">sobalink</text>
<text x="24" y="100" font-size="24" fill="#e8e9f0" font-weight="650" text-anchor="start">選んだサービスを、</text>
<text x="24" y="133" font-size="24" fill="#e8e9f0" font-weight="650" text-anchor="start">もう一方の端末へ。</text>
<text x="24" y="168" font-size="14" fill="#bdc5d8" font-weight="400" text-anchor="start">サービス共有の接続イメージ</text>
<rect x="16" y="196" width="328" height="204" rx="16" fill="#191c24"/>
<text x="32" y="228" font-size="16" fill="#bdc5d8" font-weight="600" text-anchor="start">この端末</text>
<rect x="32" y="247" width="132" height="100" rx="10" fill="#1d202a" stroke="#343846"/>
<g transform="translate(86.0 264)" fill="none" stroke="#bdc5d8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h18v13H3zM8 21h8M12 17v4"/></g>
<text x="98.0" y="321" font-size="16" fill="#e8e9f0" font-weight="600" text-anchor="middle">使うアプリ</text>
<rect x="196" y="247" width="132" height="100" rx="10" fill="#30294b"/>
<g transform="translate(250.0 265) rotate(-23 12 12)" fill="#a18bff" aria-hidden="true"><rect x="0" y="0" width="6" height="24" rx="3"/><rect x="9" y="5" width="6" height="16" rx="3"/><rect x="18" y="2" width="6" height="22" rx="3" opacity=".6"/></g>
<text x="262.0" y="321" font-size="16" fill="#c0aeff" font-weight="600" text-anchor="middle">sobalink</text>
<path d="M171 297 L189 297" fill="none" stroke="#818ba0" stroke-width="1.7"/>
<path d="m176 293-5 4 5 4 M184 293 l5 4-5 4" fill="none" stroke="#818ba0" stroke-width="1.7"/>
<text x="32" y="377" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="start">アプリには実際の接続先を設定</text>
<rect x="16" y="508" width="328" height="204" rx="16" fill="#191c24"/>
<text x="32" y="540" font-size="16" fill="#bdc5d8" font-weight="600" text-anchor="start">相手の端末</text>
<rect x="32" y="559" width="132" height="100" rx="10" fill="#30294b"/>
<g transform="translate(86.0 577) rotate(-23 12 12)" fill="#a18bff" aria-hidden="true"><rect x="0" y="0" width="6" height="24" rx="3"/><rect x="9" y="5" width="6" height="16" rx="3"/><rect x="18" y="2" width="6" height="22" rx="3" opacity=".6"/></g>
<text x="98.0" y="633" font-size="16" fill="#c0aeff" font-weight="600" text-anchor="middle">sobalink</text>
<rect x="196" y="559" width="132" height="100" rx="10" fill="#1d202a" stroke="#343846"/>
<g transform="translate(250.0 576)" fill="none" stroke="#bdc5d8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h18v13H3zM8 21h8M12 17v4"/></g>
<text x="262.0" y="633" font-size="16" fill="#e8e9f0" font-weight="600" text-anchor="middle">共有サービス</text>
<path d="M171 609 L189 609" fill="none" stroke="#818ba0" stroke-width="1.7"/>
<path d="m176 605-5 4 5 4 M184 605 l5 4-5 4" fill="none" stroke="#818ba0" stroke-width="1.7"/>
<text x="32" y="689" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="start">相手・ポート・期限を指定して許可</text>
<path d="M180 407 L180 430" fill="none" stroke="#818ba0" stroke-width="1.7"/>
<path d="m176 412 4-5 4 5 M176 425 l4 5 4-5" fill="none" stroke="#818ba0" stroke-width="1.7"/>
<path d="M180 478 L180 501" fill="none" stroke="#818ba0" stroke-width="1.7"/>
<path d="m176 483 4-5 4 5 M176 496 l4 5 4-5" fill="none" stroke="#818ba0" stroke-width="1.7"/>
<rect x="61" y="437" width="238" height="34" rx="16" fill="#30294b"/>
<text x="180" y="460" font-size="14" fill="#c0aeff" font-weight="500" text-anchor="middle">接続経路 · Direct / Relay</text>
<text x="24" y="749" font-size="14" fill="#bdc5d8" font-weight="400" text-anchor="start">到達可能な経路が必要です。</text>
<text x="24" y="776" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="start">アプリの起動・認証は別途必要です。</text>
</svg>