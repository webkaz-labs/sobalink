<svg xmlns="http://www.w3.org/2000/svg" width="960" height="744" viewBox="0 0 960 744" role="img" aria-labelledby="title desc" xml:lang="ja">
<title id="title">依頼する側・受け付ける側。</title><desc id="desc">TOFUの主経路では受信側が範囲と待受を承認し、依頼側が相手の鍵と期限を確認して依頼。完全指紋照合では両端末で独立照合後に明示承認が必要です。受信側がその依頼を承認します。発見は本人確認ではなく、TOFUは初回のなりすましを防ぎません。ペア保存後も接続とアプリ権限は別です。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Noto Sans CJK JP","Noto Sans JP",sans-serif}</style>
<rect x="0" y="0" width="960" height="744" rx="0" fill="#1d202a"/>
<text x="24" y="33" font-size="13" fill="#c0aeff" font-weight="600" text-anchor="start" id="label-4-box-916">sobalink  /  図解</text>
<text x="24" y="73" font-size="28" fill="#e8e9f0" font-weight="650" text-anchor="start" id="label-5-box-916">依頼する側・受け付ける側。</text>
<text x="24" y="105" font-size="14" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-6-box-916">近くの接続 · v2 TOFU の流れ</text>
<rect x="158" y="133" width="84" height="64" rx="9" fill="#191c24" stroke="#454959"/>
<rect x="168" y="143" width="64" height="34" rx="3" fill="#30294b"/>
<path d="M188.0 189h24 M200.0 179v10" fill="none" stroke="#9ba4b7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="200.0" y="221" font-size="15" fill="#e8e9f0" font-weight="600" text-anchor="middle" id="label-10-box-119">依頼側</text>
<rect x="718" y="133" width="84" height="64" rx="9" fill="#191c24" stroke="#454959"/>
<rect x="728" y="143" width="64" height="34" rx="3" fill="#30294b"/>
<path d="M748.0 189h24 M760.0 179v10" fill="none" stroke="#9ba4b7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="760.0" y="221" font-size="15" fill="#e8e9f0" font-weight="600" text-anchor="middle" id="label-14-box-119">受信側</text>
<path d="M200 234V580" fill="none" stroke="#454959" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6"/>
<path d="M760 234V580" fill="none" stroke="#454959" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6"/>
<rect x="620" y="231" width="250" height="30" rx="15" fill="#30294b"/>
<text x="745.0" y="252" font-size="13" fill="#c0aeff" font-weight="600" text-anchor="middle" id="label-18-box-234">範囲・待受を承認</text>
<text x="480.0" y="302" font-size="17" fill="#e8e9f0" font-weight="600" text-anchor="middle" id="label-19-box-540">依頼側で、相手の候補を選ぶ</text>
<circle cx="200" cy="320" r="12" fill="#30294b"/>
<text x="200" y="325" font-size="13" fill="#c0aeff" font-weight="650" text-anchor="middle" id="label-21-box-20">1</text>
<path d="M215 320h12v13h-12" fill="none" stroke="#a18bff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="480.0" y="342" font-size="14" fill="#bdc5d8" font-weight="400" text-anchor="middle" id="label-23-box-545">名前・IP は本人確認にならない</text>
<text x="480.0" y="390" font-size="17" fill="#e8e9f0" font-weight="600" text-anchor="middle" id="label-24-box-540">鍵・範囲・期限を確認し依頼</text>
<path d="M200 408 L760 408" fill="none" stroke="#a18bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M753.0 411.8 L760 408 L753.0 404.2" fill="none" stroke="#a18bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="200" cy="408" r="12" fill="#30294b"/>
<text x="200" y="413" font-size="13" fill="#c0aeff" font-weight="650" text-anchor="middle" id="label-28-box-20">2</text>
<text x="480.0" y="465" font-size="17" fill="#e8e9f0" font-weight="600" text-anchor="middle" id="label-29-box-540">同じ依頼を確認して承認</text>
<path d="M760 483 L200 483" fill="none" stroke="#a18bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M207.0 479.2 L200 483 L207.0 486.8" fill="none" stroke="#a18bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="760" cy="483" r="12" fill="#30294b"/>
<text x="760" y="488" font-size="13" fill="#c0aeff" font-weight="650" text-anchor="middle" id="label-33-box-20">3</text>
<text x="480.0" y="515" font-size="13" fill="#c0aeff" font-weight="600" text-anchor="middle" id="label-34-box-912">別の方法: 完全指紋照合を選ぶ場合</text>
<text x="480.0" y="539" font-size="12" fill="#bdc5d8" font-weight="400" text-anchor="middle" id="label-35-box-912">両端末で全指紋を独立照合してから、それぞれ承認</text>
<rect x="24" y="563" width="912" height="77" rx="12" fill="#30294b"/>
<text x="40" y="589" font-size="14" fill="#c0aeff" font-weight="400" text-anchor="start" id="label-37-box-900">TOFU は受け入れた鍵を記憶します。</text>
<text x="40" y="611" font-size="14" fill="#c0aeff" font-weight="400" text-anchor="start" id="label-38-box-900">初回のなりすましは防げません。</text>
<path d="M24 656H936" fill="none" stroke="#454959" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="24" y="676" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-40-box-916">ペア保存後も、接続とアプリ権限を別に確認。</text>
<text x="24" y="696" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-41-box-916">不明な結果は元のセッションで状態確認。</text>
<text x="24" y="716" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-42-box-916">発見は120秒で停止。承認期限は両端末の早い方。</text>
</svg>