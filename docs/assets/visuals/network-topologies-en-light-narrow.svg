<text x="200.0" y="638" font-size="13" fill="#5844bf" font-weight="400" text-anchor="middle" id="label-62-box-380">TCP + UDP</text>
<text x="24" y="755" font-size="14" fill="#5844bf" font-weight="600" text-anchor="start" id="label-63-box-356">Reach the exact private endpoints</text>
<text x="24" y="778" font-size="12" fill="#596172" font-weight="400" text-anchor="start" id="label-64-box-356">No relay, STUN or OS route changes.</text>
<path d="M24 830H376" fill="none" stroke="#e0e2ea" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="24" y="850" font-size="13" fill="#596172" font-weight="400" text-anchor="start" id="label-66-box-356">Mixed associates explicitly approved routes.</text>
<text x="24" y="870" font-size="13" fill="#596172" font-weight="400" text-anchor="start" id="label-67-box-356">Existing TCP does not migrate. This is not a gateway.</text>
