<svg xmlns="http://www.w3.org/2000/svg" width="400" height="920" viewBox="0 0 400 920" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Three routes to a peer.</title><desc id="desc">Tailnet uses external coordination and an available direct or relay route. Relay-based LAN needs a common approved reachable relay. Direct LAN needs exact TCP/UDP endpoint reachability. Mixed associates approved routes; it is not a gateway between unrelated networks.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Noto Sans CJK JP","Noto Sans JP",sans-serif}</style>
<rect x="0" y="0" width="400" height="920" rx="0" fill="#ffffff"/>
<text x="24" y="33" font-size="13" fill="#5844bf" font-weight="600" text-anchor="start" id="label-4-box-356">sobalink  /  EXPLAINED</text>
<text x="24" y="73" font-size="22" fill="#272c38" font-weight="650" text-anchor="start" id="label-5-box-356">Three routes to a peer.</text>
<text x="24" y="105" font-size="13" fill="#596172" font-weight="400" text-anchor="start" id="label-6-box-356">Paths show requirements, not proof of connectivity.</text>
<text x="24" y="137" font-size="19" fill="#272c38" font-weight="650" text-anchor="start" id="label-7-box-356">Tailnet</text>
