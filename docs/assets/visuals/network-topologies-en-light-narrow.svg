<circle cx="200.0" cy="463" r="2" fill="#6550d8"/>
<circle cx="215.0" cy="463" r="2" fill="#6550d8"/>
<text x="24" y="531" font-size="14" fill="#5844bf" font-weight="600" text-anchor="start" id="label-46-box-356">Both peers reach the same relay</text>
<text x="24" y="554" font-size="12" fill="#596172" font-weight="400" text-anchor="start" id="label-47-box-356">Approved anchor; hosting never moves automatically.</text>
