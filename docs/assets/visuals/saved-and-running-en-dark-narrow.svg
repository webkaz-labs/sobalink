<svg xmlns="http://www.w3.org/2000/svg" width="400" height="800" viewBox="0 0 400 800" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Save settings. Start separately.</title><desc id="desc">Saving creates a stopped definition. A separately reviewed start creates live runtime. Stopping preserves the settings. Ordinary saved services remain stopped after process restart.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Noto Sans CJK JP","Noto Sans JP",sans-serif}</style>
<rect x="0" y="0" width="400" height="800" rx="0" fill="#1d202a"/>
<text x="24" y="33" font-size="13" fill="#c0aeff" font-weight="600" text-anchor="start" id="label-4-box-356">sobalink  /  EXPLAINED</text>
<text x="24" y="73" font-size="22" fill="#e8e9f0" font-weight="650" text-anchor="start" id="label-5-box-356">Save settings. Start separately.</text>
<text x="24" y="105" font-size="14" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-6-box-356">Ordinary saved services · manual start</text>
<rect x="24" y="138" width="352" height="102" rx="12" fill="#191c24" stroke="#454959"/>
<rect x="42" y="158" width="36" height="50" rx="4" fill="#30294b" stroke="#454959"/>
<path d="M50 172h20 M50 181h20 M50 190h14" fill="none" stroke="#a18bff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="94" y="170" font-size="19" fill="#e8e9f0" font-weight="650" text-anchor="start" id="label-10-box-286">Saved definition</text>
<text x="94" y="196" font-size="12" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-11-box-280">Peer, ports and lifetime</text>
<text x="94" y="218" font-size="12" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-12-box-280">Saving opens no listeners or grants</text>
<path d="M200.0 247V278" fill="none" stroke="#9ba4b7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/>
<rect x="110" y="290" width="180" height="60" rx="30" fill="#191c24" stroke="#454959"/>
<text x="200" y="327" font-size="20" fill="#c0aeff" font-weight="650" text-anchor="middle" id="label-15-box-160">Stopped</text>
<rect x="110" y="484" width="180" height="60" rx="30" fill="#30294b" stroke="#454959"/>
<text x="200" y="521" font-size="20" fill="#c0aeff" font-weight="650" text-anchor="middle" id="label-17-box-160">Started</text>
<path d="M200 358 L200 476" fill="none" stroke="#a18bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M196.2 469.0 L200 476 L203.8 469.0" fill="none" stroke="#a18bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="398" width="320" height="43" rx="0" fill="#1d202a"/>
<text x="200" y="415" font-size="13" fill="#c0aeff" font-weight="600" text-anchor="middle" id="label-21-box-320">Review the scope, then explicitly start</text>
<text x="200" y="436" font-size="12" fill="#bdc5d8" font-weight="400" text-anchor="middle" id="label-22-box-320">Recheck network and peer identity</text>
<path d="M295 525H368V314H297" fill="none" stroke="#9ba4b7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M313 314 L297 314" fill="none" stroke="#9ba4b7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M304.0 310.2 L297 314 L304.0 317.8" fill="none" stroke="#9ba4b7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="352" y="474" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="middle" id="label-26-box-50">Stop</text>
<rect x="54.0" y="607" width="292" height="30" rx="15" fill="#30294b"/>
<text x="200.0" y="628" font-size="13" fill="#c0aeff" font-weight="600" text-anchor="middle" id="label-28-box-276">Check the actual app and its login</text>
<path d="M24 668H376" fill="none" stroke="#454959" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="24" y="688" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-30-box-356">Ordinary definitions stay stopped after process restart.</text>
<text x="24" y="708" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-31-box-356">Automatic startup uses separately reviewed approvals.</text>
<text x="24" y="728" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-32-box-356">Stop ends live authority; the saved definition remains.</text>
</svg>