<text x="567.5" y="364" font-size="16" fill="#5844bf" font-weight="650" text-anchor="middle" id="label-42-box-68">Relay</text>
<circle cx="552.5" cy="375" r="2" fill="#6550d8"/>
<circle cx="567.5" cy="375" r="2" fill="#6550d8"/>
<circle cx="582.5" cy="375" r="2" fill="#6550d8"/>
<text x="24" y="414" font-size="14" fill="#5844bf" font-weight="600" text-anchor="start" id="label-46-box-916">Both peers reach the same relay</text>
<text x="24" y="437" font-size="14" fill="#596172" font-weight="400" text-anchor="start" id="label-47-box-916">Approved anchor; hosting never moves automatically.</text>
