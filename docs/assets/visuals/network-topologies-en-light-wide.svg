<text x="567.5" y="492" font-size="13" fill="#5844bf" font-weight="400" text-anchor="middle" id="label-62-box-765">TCP + UDP</text>
<text x="24" y="580" font-size="14" fill="#5844bf" font-weight="600" text-anchor="start" id="label-63-box-916">Reach the exact private endpoints</text>
<text x="24" y="603" font-size="14" fill="#596172" font-weight="400" text-anchor="start" id="label-64-box-916">No relay, STUN or OS route changes.</text>
<path d="M24 630H936" fill="none" stroke="#e0e2ea" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="24" y="650" font-size="13" fill="#596172" font-weight="400" text-anchor="start" id="label-66-box-916">Mixed associates explicitly approved routes.</text>
<text x="24" y="670" font-size="13" fill="#596172" font-weight="400" text-anchor="start" id="label-67-box-916">Existing TCP does not migrate. This is not a gateway.</text>
