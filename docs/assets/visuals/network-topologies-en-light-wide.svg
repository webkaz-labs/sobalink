<text x="567.5" y="187" font-size="13" fill="#5844bf" font-weight="600" text-anchor="middle" id="label-19-box-118">Direct / Relay</text>
<text x="567.5" y="144" font-size="13" fill="#596172" font-weight="400" text-anchor="middle" id="label-20-box-765">External coordination</text>
<path d="M343 157L477.5 141 M657.5 141L792 157" fill="none" stroke="#7f8799" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/>
<text x="24" y="248" font-size="14" fill="#5844bf" font-weight="600" text-anchor="start" id="label-22-box-916">Enrollment + external coordination</text>
<text x="24" y="271" font-size="14" fill="#596172" font-weight="400" text-anchor="start" id="label-23-box-916">The usable path depends on network conditions.</text>
