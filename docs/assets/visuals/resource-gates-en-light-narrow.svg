<svg xmlns="http://www.w3.org/2000/svg" width="400" height="740" viewBox="0 0 400 740" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Policy ≠ available resources.</title><desc id="desc">Logical allowance, finite resource budgets and actual OS capacity are independent constraints. Raising capacity does not change authority or lifetime.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Noto Sans CJK JP","Noto Sans JP",sans-serif}</style>
<rect x="0" y="0" width="400" height="740" rx="0" fill="#ffffff"/>
<text x="24" y="33" font-size="13" fill="#5844bf" font-weight="600" text-anchor="start" id="label-4-box-356">sobalink  /  EXPLAINED</text>
<text x="24" y="73" font-size="22" fill="#272c38" font-weight="650" text-anchor="start" id="label-5-box-356">Policy ≠ available resources.</text>
<text x="24" y="105" font-size="14" fill="#596172" font-weight="400" text-anchor="start" id="label-6-box-356">Admission needs every applicable condition.</text>
<rect x="24" y="139" width="352" height="414" rx="16" fill="#f8f8fb" stroke="#e0e2ea"/>
<rect x="44" y="237" width="312" height="316" rx="16" fill="#f0edff" stroke="#e0e2ea"/>
<rect x="64" y="335" width="272" height="218" rx="16" fill="#ffffff" stroke="#e0e2ea"/>
<text x="40" y="168" font-size="18" fill="#272c38" font-weight="650" text-anchor="start" id="label-10-box-340">1  Logical choice</text>
<text x="40" y="196" font-size="14" fill="#596172" font-weight="400" text-anchor="start" id="label-11-box-340">Example: file size / entry count</text>
<text x="40" y="218" font-size="14" fill="#596172" font-weight="400" text-anchor="start" id="label-12-box-340">default / limited / unlimited</text>
<text x="60" y="267" font-size="18" fill="#272c38" font-weight="650" text-anchor="start" id="label-13-box-320">2  Finite resource budgets</text>
<text x="60" y="294" font-size="13" fill="#596172" font-weight="400" text-anchor="start" id="label-14-box-320">Sender spool, receiver reservations</text>
<text x="60" y="316" font-size="13" fill="#596172" font-weight="400" text-anchor="start" id="label-15-box-320">No unlimited option; listeners / flows stay finite.</text>
<text x="80" y="365" font-size="16" fill="#272c38" font-weight="650" text-anchor="start" id="label-16-box-240">3  Actual available resources</text>
<text x="80" y="395" font-size="12" fill="#596172" font-weight="400" text-anchor="start" id="label-17-box-240">Disk, memory and OS limits</text>
<text x="80" y="417" font-size="12" fill="#596172" font-weight="400" text-anchor="start" id="label-18-box-240">Work may fail below the budget.</text>
<text x="80" y="449" font-size="12" fill="#596172" font-weight="400" text-anchor="start" id="label-19-box-300">Disk headroom (schematic)</text>
<rect x="80" y="464" width="240" height="22" rx="4" fill="#f8f8fb" stroke="#e0e2ea"/>
<rect x="80" y="464" width="132.0" height="22" rx="4" fill="#f0edff"/>
<rect x="212.0" y="464" width="108.0" height="22" rx="0" fill="#e0e2ea"/>
<text x="80" y="510" font-size="12" fill="#5844bf" font-weight="400" text-anchor="start" id="label-23-box-300">Data + reservations</text>
<text x="320" y="510" font-size="12" fill="#596172" font-weight="400" text-anchor="end" id="label-24-box-140">Free-space margin</text>
<path d="M200.0 562 L200.0 595" fill="none" stroke="#6550d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M196.2 588.0 L200.0 595 L203.8 588.0" fill="none" stroke="#6550d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="80.0" y="605" width="240" height="30" rx="15" fill="#f0edff"/>
<text x="200.0" y="626" font-size="13" fill="#5844bf" font-weight="600" text-anchor="middle" id="label-28-box-224">Compare usage / effective limits</text>
<path d="M24 661H376" fill="none" stroke="#e0e2ea" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="24" y="681" font-size="13" fill="#596172" font-weight="400" text-anchor="start" id="label-30-box-356">Capacity changes do not expand permission or lifetime.</text>
<text x="24" y="701" font-size="13" fill="#596172" font-weight="400" text-anchor="start" id="label-31-box-356">Logical unlimited still obeys finite resource budgets.</text>
<text x="24" y="721" font-size="13" fill="#596172" font-weight="400" text-anchor="start" id="label-32-box-356">Default resolves to a value, not zero or unlimited.</text>
</svg>