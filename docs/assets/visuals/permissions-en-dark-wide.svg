<svg xmlns="http://www.w3.org/2000/svg" width="960" height="690" viewBox="0 0 960 690" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Separate gates, separate choices.</title><desc id="desc">Connectivity, sender trust, file-save consent, autosave and scoped service sharing are independent permissions.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Noto Sans CJK JP","Noto Sans JP",sans-serif}</style>
<rect x="0" y="0" width="960" height="690" rx="0" fill="#1d202a"/>
<text x="24" y="33" font-size="13" fill="#c0aeff" font-weight="600" text-anchor="start" id="label-4-box-916">sobalink  /  EXPLAINED</text>
<text x="24" y="73" font-size="28" fill="#e8e9f0" font-weight="650" text-anchor="start" id="label-5-box-916">Separate gates, separate choices.</text>
<text x="24" y="105" font-size="15" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-6-box-916">A connection does not approve receiving or sharing.</text>
<rect x="24" y="136" width="205" height="30" rx="15" fill="#30294b"/>
<text x="126.5" y="157" font-size="13" fill="#c0aeff" font-weight="600" text-anchor="middle" id="label-8-box-189">Connected transport</text>
<path d="M40 171V197H710" fill="none" stroke="#454959" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M240 197V232 M710 197V232" fill="none" stroke="#454959" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="24" y="232" width="436" height="278" rx="12" fill="#191c24" stroke="#454959"/>
<text x="40" y="262" font-size="17" fill="#e8e9f0" font-weight="650" text-anchor="start" id="label-12-box-404">A  Receive messages / files</text>
<rect x="40" y="282" width="404" height="30" rx="15" fill="#30294b"/>
<text x="242.0" y="303" font-size="13" fill="#c0aeff" font-weight="600" text-anchor="middle" id="label-14-box-388">Trust this sender</text>
<path d="M242.0 319v15H101v17 M242.0 334H378v17" fill="none" stroke="#a18bff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="101" y="372" font-size="14" fill="#c0aeff" font-weight="400" text-anchor="middle" id="label-16-box-140">Receive text</text>
<text x="378" y="372" font-size="14" fill="#c0aeff" font-weight="400" text-anchor="middle" id="label-17-box-140">File offer</text>
<path d="M378 384 L378 407" fill="none" stroke="#a18bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M374.2 400.0 L378 407 L381.8 400.0" fill="none" stroke="#a18bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="378" y="432" font-size="14" fill="#e8e9f0" font-weight="600" text-anchor="middle" id="label-20-box-160">Consent to save</text>
<text x="40" y="465" font-size="14" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-21-box-404">Default: accept each batch</text>
<text x="40" y="487" font-size="14" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-22-box-404">Autosave: separately approve peer + folder</text>
<rect x="500" y="232" width="436" height="194" rx="12" fill="#191c24" stroke="#454959"/>
<text x="516" y="262" font-size="17" fill="#e8e9f0" font-weight="650" text-anchor="start" id="label-24-box-404">B  Share a service</text>
<rect x="516" y="282" width="404" height="30" rx="15" fill="#30294b"/>
<text x="718.0" y="303" font-size="13" fill="#c0aeff" font-weight="600" text-anchor="middle" id="label-26-box-388">Allow peers, ports and lifetime</text>
<path d="M718.0 321 L718.0 347" fill="none" stroke="#a18bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M714.2 340.0 L718.0 347 L721.8 340.0" fill="none" stroke="#a18bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="718.0" y="375" font-size="14" fill="#c0aeff" font-weight="600" text-anchor="middle" id="label-29-box-406">Expose only the scoped service</text>
<text x="718.0" y="403" font-size="12" fill="#bdc5d8" font-weight="400" text-anchor="middle" id="label-30-box-406">App setup / login remains separate</text>
<path d="M24 590H936" fill="none" stroke="#454959" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="24" y="610" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-32-box-916">A and B require independent approvals.</text>
<text x="24" y="630" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-33-box-916">The receiving device controls its own permissions.</text>
<text x="24" y="650" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-34-box-916">Reverse direction needs the other receiver’s approval.</text>
</svg>