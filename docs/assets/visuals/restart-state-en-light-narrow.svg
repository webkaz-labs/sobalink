<text x="330" y="232" font-size="12" fill="#596172" font-weight="400" text-anchor="middle" id="label-13-box-100">offline</text>
<text x="24" y="219" font-size="15" fill="#596172" font-weight="600" text-anchor="start" id="label-14-box-356">State</text>
