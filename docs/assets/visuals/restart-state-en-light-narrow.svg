<text x="24" y="33" font-size="13" fill="#5844bf" font-weight="600" text-anchor="start" id="label-4-box-356">sobalink  /  EXPLAINED</text>
<text x="24" y="73" font-size="22" fill="#272c38" font-weight="650" text-anchor="start" id="label-5-box-356">What returns after restart?</text>
<text x="24" y="105" font-size="13" fill="#596172" font-weight="400" text-anchor="start" id="label-6-box-356">Same profile · stop first, then choose startup mode</text>
<rect x="108.0" y="130" width="184" height="30" rx="15" fill="#f0edff"/>
<text x="200.0" y="151" font-size="13" fill="#5844bf" font-weight="600" text-anchor="middle" id="label-8-box-168">Stop → new process</text>
