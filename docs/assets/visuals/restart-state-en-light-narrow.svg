<text x="24" y="672" font-size="13" fill="#596172" font-weight="400" text-anchor="start" id="label-41-box-356">Conditional: current connection, permission and pause.</text>
<text x="24" y="692" font-size="13" fill="#596172" font-weight="400" text-anchor="start" id="label-42-box-356">Durable attempts keep the original ID and deadline.</text>
<text x="24" y="712" font-size="13" fill="#596172" font-weight="400" text-anchor="start" id="label-43-box-356">Offline does not erase saved approvals.</text>
<text x="24" y="732" font-size="13" fill="#596172" font-weight="400" text-anchor="start" id="label-44-box-356">Check connectivity separately with soba status.</text>
