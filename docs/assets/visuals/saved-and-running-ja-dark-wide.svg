<svg xmlns="http://www.w3.org/2000/svg" width="960" height="690" viewBox="0 0 960 690" role="img" aria-labelledby="title desc" xml:lang="ja">
<title id="title">設定を保存。開始は、別の操作。</title><desc id="desc">保存は停止した定義を作ります。別途内容を確認して開始すると実行状態になり、停止は設定を保って稼働だけを止めます。通常の保存定義はプロセス再起動しても停止したままです。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Noto Sans CJK JP","Noto Sans JP",sans-serif}</style>
<rect x="0" y="0" width="960" height="690" rx="0" fill="#1d202a"/>
<text x="24" y="33" font-size="13" fill="#c0aeff" font-weight="600" text-anchor="start" id="label-4-box-916">sobalink  /  図解</text>
<text x="24" y="73" font-size="28" fill="#e8e9f0" font-weight="650" text-anchor="start" id="label-5-box-916">設定を保存。開始は、別の操作。</text>
<text x="24" y="105" font-size="14" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-6-box-916">通常の保存サービスを手動で開始する場合</text>
<rect x="24" y="138" width="912" height="102" rx="12" fill="#191c24" stroke="#454959"/>
<rect x="42" y="158" width="36" height="50" rx="4" fill="#30294b" stroke="#454959"/>
<path d="M50 172h20 M50 181h20 M50 190h14" fill="none" stroke="#a18bff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="94" y="170" font-size="19" fill="#e8e9f0" font-weight="650" text-anchor="start" id="label-10-box-846">保存済みの定義</text>
<text x="94" y="196" font-size="14" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-11-box-840">相手・ポート・期限などの設定</text>
<text x="94" y="218" font-size="14" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-12-box-840">保存だけでは待受や許可を開始しない</text>
<path d="M480.0 247V278" fill="none" stroke="#9ba4b7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/>
<rect x="140" y="308" width="180" height="60" rx="30" fill="#191c24" stroke="#454959"/>
<text x="230" y="345" font-size="20" fill="#c0aeff" font-weight="650" text-anchor="middle" id="label-15-box-160">停止中</text>
<rect x="640" y="308" width="180" height="60" rx="30" fill="#30294b" stroke="#454959"/>
<text x="730" y="345" font-size="20" fill="#c0aeff" font-weight="650" text-anchor="middle" id="label-17-box-160">実行中</text>
<path d="M330 338 L630 338" fill="none" stroke="#a18bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M623.0 341.8 L630 338 L623.0 334.2" fill="none" stroke="#a18bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="480" y="304" font-size="16" fill="#c0aeff" font-weight="600" text-anchor="middle" id="label-20-box-300">内容を確認して開始</text>
<text x="480" y="376" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="middle" id="label-21-box-330">ネットワークと相手を再確認</text>
<path d="M730 377V428H230V377" fill="none" stroke="#9ba4b7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M230 392 L230 375" fill="none" stroke="#9ba4b7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M233.8 382.0 L230 375 L226.2 382.0" fill="none" stroke="#9ba4b7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="480" y="453" font-size="15" fill="#bdc5d8" font-weight="400" text-anchor="middle" id="label-25-box-430">停止: 稼働を終了。定義は残る。</text>
<rect x="334.0" y="518" width="292" height="30" rx="15" fill="#30294b"/>
<text x="480.0" y="539" font-size="13" fill="#c0aeff" font-weight="600" text-anchor="middle" id="label-27-box-276">実アプリの接続・認証は別に確認</text>
<path d="M24 579H936" fill="none" stroke="#454959" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="24" y="599" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-29-box-916">通常の定義は、プロセス再起動後も停止したまま。</text>
<text x="24" y="619" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-30-box-916">自動の起動選択は、別途確認・承認する設定です。</text>
<text x="24" y="639" font-size="13" fill="#bdc5d8" font-weight="400" text-anchor="start" id="label-31-box-916">停止で終了するのは稼働と許可。定義は残ります。</text>
</svg>